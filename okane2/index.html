<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="おかいもの">
<meta name="theme-color" content="#FAF7EF">
<title>おかいものを しよう｜MieeL</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;700;800&family=Klee+One:wght@600&display=swap" rel="stylesheet">
<style>
/*MZ-SHELL-CSS*/
/* ==========================================================================
   MieeL アプリ共通シェル（iPad 向け・全画面アプリ型）  shell.css
   ※ このファイルは _shell/build.py で各アプリの index.html に埋め込まれます
   ========================================================================== */
:root{
  --mz-main:#3F9D8B; --mz-main-d:#2C6B5D; --mz-soft:#DBEFEA;
  --mz-bg:#FAF7EF; --mz-card:#FFFFFF; --mz-ink:#2E2A25; --mz-sub:#7D7466; --mz-line:#EAE1CE;
  --mz-ok:#2F9E44; --mz-ok-d:#237A34; --mz-ok-soft:#E3F3E6;
  --mz-ng:#E03131; --mz-ng-soft:#FFE3E3;
  --mz-gold:#FAB005; --mz-blue:#1C7ED6; --mz-blue-d:#1864AB;
  --mieel:radial-gradient(circle at 50% 0%,#1B8FE8 0%,#2BB8D6 28%,#3FCB9E 45%,#8FD24A 58%,#F4D027 72%,#F7941E 100%);
  --mz-font:"M PLUS Rounded 1c","Hiragino Maru Gothic ProN","BIZ UDPGothic","Yu Gothic UI",sans-serif;
  --mz-emoji:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif;
  --mz-scale:1;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;height:100%;}
body.mz{
  background:var(--mz-bg);color:var(--mz-ink);font-family:var(--mz-font);font-weight:700;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:manipulation;overscroll-behavior:none;
  display:flex;flex-direction:column;height:100vh;height:100dvh;overflow:hidden;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  word-break:keep-all;overflow-wrap:anywhere;
}
:where(body.mz) button{font-family:inherit;font-weight:inherit;color:inherit;cursor:pointer;touch-action:manipulation;}
body.mz.big-text{--mz-scale:1.18;}
.mz-emoji{font-family:var(--mz-emoji);font-weight:400;line-height:1;}

/* ---------- 上のバー ---------- */
.mz-top{flex:none;display:flex;align-items:center;gap:12px;padding:8px 16px;min-height:66px;}
.mz-brand{display:flex;align-items:center;gap:7px;white-space:nowrap;flex:none;}
.mz-orb{width:22px;height:22px;border-radius:50%;background:var(--mieel);flex:none;}
.mz-brand strong{font-size:16px;}
.mz-brand .url{font-size:12px;color:var(--mz-sub);font-weight:500;}
.mz-apptitle{flex:1;min-width:0;display:flex;align-items:center;justify-content:center;gap:8px;font-size:clamp(18px,2.3vw,24px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.mz-apptitle .mz-emoji{font-size:1.3em;}
.mz-topbtn{flex:none;height:48px;padding:0 16px;border-radius:999px;border:3px solid var(--mz-line);background:#fff;font-size:16px;display:flex;align-items:center;gap:6px;box-shadow:0 3px 0 var(--mz-line);}
.mz-topbtn[hidden]{display:none;}
.mz-gear{position:relative;flex:none;width:50px;height:50px;border-radius:50%;border:none;background:transparent;opacity:.35;font-size:25px;display:grid;place-items:center;}
.mz-gear::after{content:"";position:absolute;inset:2px;border-radius:50%;border:4px solid transparent;}
.mz-gear.pressing{opacity:1;}
.mz-gear.pressing::after{border-color:var(--mz-blue);animation:mzRing 1.5s linear forwards;}
@keyframes mzRing{from{clip-path:inset(0 100% 0 0);}to{clip-path:inset(0 0 0 0);}}

main#mzView{flex:1;min-height:0;display:flex;flex-direction:column;padding:0 18px 16px;}
.mz-screen{flex:1;min-height:0;display:flex;flex-direction:column;animation:mzIn .25s ease-out;}
@keyframes mzIn{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:none;}}
@keyframes mzPop{from{transform:scale(.7);opacity:0;}to{transform:none;opacity:1;}}
@keyframes mzShake{20%,60%{transform:translateX(-10px);}40%,80%{transform:translateX(10px);}}
.mz-h1{margin:2px 0 12px;text-align:center;font-size:calc(clamp(26px,3.8vw,42px)*var(--mz-scale));}

/* ---------- ホーム：モードカード ---------- */
.mz-home{overflow-y:auto;padding-bottom:8px;}
.mz-modes{flex:1;display:grid;grid-template-columns:repeat(var(--mcols,2),minmax(0,1fr));grid-auto-rows:minmax(150px,1fr);gap:clamp(12px,2vw,20px);max-width:1100px;width:100%;margin:0 auto;}
@media (orientation:portrait){.mz-modes{--mcols:2!important;}}
.mz-mode{
  --c:var(--mz-main);position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;
  min-height:190px;padding:16px 12px;border-radius:30px;background:#fff;border:6px solid var(--c);
  box-shadow:0 7px 0 rgba(0,0,0,.12);text-align:center;
}
.mz-mode:active{transform:translateY(5px);box-shadow:0 2px 0 rgba(0,0,0,.12);}
.mz-mode .mz-emoji{font-size:calc(clamp(52px,6.5vw,72px)*var(--mz-scale));}
.mz-mode .nm{font-size:calc(clamp(22px,2.6vw,30px)*var(--mz-scale));}
.mz-mode .sb{font-size:calc(15px*var(--mz-scale));color:var(--mz-sub);font-weight:500;}
.mz-mode .best{position:absolute;top:8px;right:12px;color:var(--mz-gold);font-size:18px;letter-spacing:1px;}

/* ---------- レベル ---------- */
.mz-bar{flex:none;display:flex;align-items:center;gap:10px;margin-bottom:10px;}
.mz-back{flex:none;height:60px;padding:0 22px;border-radius:999px;border:4px solid #ADB5BD;background:#fff;color:#495057;font-size:22px;box-shadow:0 4px 0 #DEE2E6;}
.mz-back:active{transform:translateY(3px);box-shadow:0 1px 0 #DEE2E6;}
.mz-bar .mz-label{flex:1;min-width:0;text-align:center;font-size:calc(clamp(20px,2.4vw,28px)*var(--mz-scale));white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.mz-levels{flex:1;display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));grid-auto-rows:minmax(200px,min(52vh,340px));gap:18px;align-content:center;max-width:1060px;width:100%;margin:0 auto;}
.mz-level{
  --c:var(--mz-main);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;min-height:200px;
  border-radius:30px;border:6px solid var(--c);background:#fff;box-shadow:0 7px 0 rgba(0,0,0,.12);padding:16px;text-align:center;
}
.mz-level:active{transform:translateY(5px);box-shadow:0 2px 0 rgba(0,0,0,.12);}
.mz-level .stars{font-size:34px;color:var(--mz-gold);letter-spacing:4px;}
.mz-level .nm{font-size:calc(clamp(22px,2.6vw,30px)*var(--mz-scale));}
.mz-level .best{font-size:15px;color:var(--mz-sub);font-weight:500;}

/* ---------- あそぶ画面 ---------- */
.mz-dots{display:flex;gap:6px;flex:none;}
.mz-dots i{width:18px;height:18px;border-radius:50%;background:#E9E2D2;display:block;}
.mz-dots i.ok{background:var(--mz-gold);}
.mz-dots i.miss{background:#CFC6B4;}
.mz-dots i.now{background:#fff;border:4px solid var(--c,var(--mz-main));}
.mz-say{flex:none;width:64px;height:64px;border-radius:50%;border:4px solid var(--mz-line);background:#fff;font-size:30px;display:grid;place-items:center;box-shadow:0 4px 0 var(--mz-line);}
.mz-say:active{transform:translateY(3px);box-shadow:0 1px 0 var(--mz-line);}
.mz-stage{flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:safe center;gap:clamp(12px,2.2vh,24px);overflow-y:auto;padding-bottom:6px;}
.mz-stage.answered{padding-bottom:110px;}
.mz-q.compact{flex-direction:row;justify-content:center;gap:14px;padding:10px 24px;}
.mz-q.compact .qi{font-size:calc(44px*var(--mz-scale));}
.mz-q.compact .qt{font-size:calc(clamp(22px,2.8vw,32px)*var(--mz-scale));}
.mz-ow{width:min(100%,1100px);display:grid;grid-template-columns:1fr 1fr;gap:18px;align-items:start;}
.mz-ow .mz-slots,.mz-ow .mz-pool{width:100%;}
.mz-ow .mz-pool{flex-direction:column;align-items:stretch;}
.mz-ow .mz-tile{text-align:left;}
@media (orientation:portrait){.mz-ow{grid-template-columns:1fr;}.mz-ow .mz-pool{flex-direction:row;align-items:center;}}
.mz-q{
  --c:var(--mz-main);width:min(100%,900px);background:#fff;border:6px solid var(--c);border-radius:32px;
  padding:clamp(14px,2.4vh,26px) clamp(16px,3vw,34px);text-align:center;box-shadow:0 7px 0 rgba(0,0,0,.08);
  display:flex;flex-direction:column;align-items:center;gap:8px;animation:mzPop .35s cubic-bezier(.2,1.4,.4,1);
}
.mz-q .qi{font-size:calc(clamp(46px,7vh,76px)*var(--mz-scale));}
.mz-q .qi.big{font-size:calc(clamp(90px,17vh,150px)*var(--mz-scale));}
.mz-q .qt{font-size:calc(clamp(24px,3.4vw,38px)*var(--mz-scale));line-height:1.45;}
.mz-q .qs{font-size:calc(clamp(16px,1.9vw,20px)*var(--mz-scale));color:var(--mz-sub);font-weight:500;}
.mz-q .qv{display:flex;justify-content:center;align-items:center;max-width:100%;}
.mz-q .qv svg{max-width:100%;height:auto;}
.mz-opts{width:min(100%,960px);display:grid;gap:clamp(10px,1.6vw,18px);grid-template-columns:repeat(var(--cols,2),minmax(0,1fr));}
.mz-opt{
  --c:var(--mz-main);min-height:calc(clamp(84px,13vh,112px)*var(--mz-scale));padding:12px 18px;border-radius:26px;border:5px solid var(--c);background:#fff;
  font-size:calc(clamp(22px,2.9vw,34px)*var(--mz-scale));line-height:1.35;box-shadow:0 6px 0 var(--c);text-align:center;
  display:flex;align-items:center;justify-content:center;gap:10px;
}
.mz-opt:active{transform:translateY(5px);box-shadow:0 1px 0 var(--c);}
.mz-opt .mz-emoji{font-size:1.4em;}
.mz-opt.stack{flex-direction:column;gap:4px;padding:10px 8px;}
.mz-opt.stack .mz-emoji{font-size:1.6em;}
.mz-opt.ok{background:var(--mz-ok-soft);border-color:var(--mz-ok);box-shadow:0 6px 0 var(--mz-ok-d);color:#1F6A34;}
.mz-opt.ng{animation:mzShake .45s;border-color:var(--mz-ng);background:var(--mz-ng-soft);box-shadow:0 6px 0 #B02525;}
.mz-opt.gone{opacity:.28;pointer-events:none;box-shadow:none;transform:none;}
.mz-opt.dim{opacity:.35;}
.mz-explain{width:min(100%,860px);background:var(--mz-ok-soft);border-radius:18px;padding:10px 18px;font-size:calc(18px*var(--mz-scale));font-weight:500;text-align:center;line-height:1.6;animation:mzPop .3s ease-out;}
.mz-next{
  position:fixed;right:max(20px,env(safe-area-inset-right));bottom:max(20px,env(safe-area-inset-bottom));z-index:60;
  height:84px;padding:0 44px;border:none;border-radius:999px;background:var(--mz-ok);color:#fff;
  font-size:calc(clamp(26px,3.2vw,36px)*var(--mz-scale));box-shadow:0 7px 0 var(--mz-ok-d);animation:mzPop .35s ease-out, mzNudge 1.4s ease-in-out .6s infinite;
}
.mz-next:active{transform:translateY(5px);box-shadow:0 2px 0 var(--mz-ok-d);}
@keyframes mzNudge{50%{transform:scale(1.05);}}
.mz-hint{color:var(--mz-sub);font-weight:500;font-size:calc(17px*var(--mz-scale));text-align:center;}

/* ならべる */
.mz-slots{width:min(100%,960px);display:flex;flex-wrap:wrap;gap:10px;justify-content:center;padding:14px;border-radius:24px;border:4px dashed var(--mz-line);background:#FCFAF3;min-height:96px;}
.mz-slots.col{flex-direction:column;flex-wrap:nowrap;align-items:stretch;gap:8px;padding:10px 14px;}
.mz-slots.col .mz-slot{justify-content:flex-start;min-height:58px;}
.mz-slot{min-width:110px;min-height:72px;border-radius:18px;border:4px dashed #D9CFBB;background:#fff;display:flex;align-items:center;justify-content:center;gap:8px;padding:6px 14px;font-size:calc(clamp(18px,2.2vw,26px)*var(--mz-scale));}
.mz-slot .no{width:30px;height:30px;border-radius:50%;background:var(--c,var(--mz-main));color:#fff;display:grid;place-items:center;font-size:16px;flex:none;}
.mz-slot.filled{border-style:solid;border-color:var(--c,var(--mz-main));}
.mz-slot.ok{border-color:var(--mz-ok);background:var(--mz-ok-soft);}
.mz-slot.ng{border-color:var(--mz-ng);background:var(--mz-ng-soft);animation:mzShake .45s;}
.mz-pool{width:min(100%,960px);display:flex;flex-wrap:wrap;gap:12px;justify-content:center;}
.mz-tile{
  --c:var(--mz-main);min-height:72px;padding:8px 20px;border-radius:18px;border:5px solid var(--c);background:#fff;
  font-size:calc(clamp(18px,2.2vw,26px)*var(--mz-scale));box-shadow:0 5px 0 var(--c);
}
.mz-tile:active{transform:translateY(4px);box-shadow:0 1px 0 var(--c);}

/* よこならび（ながい ぶんしょう＋こたえ） */
.mz-side{width:min(100%,1180px);flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:18px;align-items:stretch;}
.mz-side>.mz-q{width:100%;overflow-y:auto;justify-content:safe center;}
.mz-sidep{display:flex;flex-direction:column;justify-content:safe center;gap:12px;min-height:0;overflow-y:auto;padding:4px 4px 10px;}
.mz-sidep .mz-opts{width:100%;}
.mz-sidep .mz-opt{min-height:calc(clamp(64px,9.5vh,92px)*var(--mz-scale));font-size:calc(clamp(19px,2.2vw,26px)*var(--mz-scale));padding:8px 14px;}
.mz-ask{width:min(100%,900px);text-align:center;font-size:calc(clamp(22px,2.7vw,30px)*var(--mz-scale));line-height:1.5;}
.mz-ask .tag{display:inline-block;font-size:.7em;padding:2px 12px;border-radius:999px;background:var(--mz-soft);color:var(--mz-main-d);margin-right:8px;vertical-align:middle;}
.mz-stage.answered .mz-sidep{padding-bottom:100px;}

/* なぞり */
.tmsg{font-size:calc(19px*var(--mz-scale));color:var(--mz-sub);text-align:center;}
.trace{position:relative;height:min(50vh,420px);aspect-ratio:var(--ar,1);max-width:100%;background:#fff;border-radius:28px;border:5px solid var(--mz-line);box-shadow:0 6px 0 rgba(0,0,0,.06);}
.trace canvas{position:absolute;inset:0;width:100%;height:100%;border-radius:24px;}
.trace .ti{touch-action:none;}
.trace .gridl{position:absolute;inset:0;border-radius:24px;pointer-events:none;background:linear-gradient(90deg,transparent calc(50% - 1px),#EADFC8 calc(50% - 1px),#EADFC8 calc(50% + 1px),transparent calc(50% + 1px)),linear-gradient(0deg,transparent calc(50% - 1px),#EADFC8 calc(50% - 1px),#EADFC8 calc(50% + 1px),transparent calc(50% + 1px));opacity:.8;}
.tbar{display:flex;gap:16px;}
.tbtn{height:64px;padding:0 26px;border-radius:999px;border:4px solid var(--mz-line);background:#fff;font-size:22px;box-shadow:0 4px 0 var(--mz-line);}
.tbtn.ok{background:var(--mz-ok);border-color:var(--mz-ok-d);color:#fff;box-shadow:0 5px 0 var(--mz-ok-d);}

/* すうじキー */
.mz-pad{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:clamp(8px,1.2vh,12px);width:min(100%,330px);}
.mz-pad button{height:calc(clamp(54px,8.4vh,80px)*var(--mz-scale));border-radius:20px;border:4px solid #D9CFBB;background:#fff;font-size:calc(clamp(28px,4vh,40px)*var(--mz-scale));box-shadow:0 5px 0 #D9CFBB;}
.mz-pad button.fn{background:#F4EFE3;}
.mz-pad button.ok{background:var(--mz-ok);border-color:var(--mz-ok-d);color:#fff;box-shadow:0 5px 0 var(--mz-ok-d);}
.mz-pad button:active{transform:translateY(4px);box-shadow:0 1px 0 #D9CFBB;}

/* ---------- けっか ---------- */
.mz-result{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:clamp(10px,2vh,22px);text-align:center;}
.mz-result h2{margin:0;font-size:calc(clamp(44px,7vw,84px)*var(--mz-scale));color:#F76707;-webkit-text-stroke:3px #fff;paint-order:stroke fill;}
.mz-result .big-stars{font-size:clamp(46px,7vw,76px);letter-spacing:6px;}
.mz-result .big-stars .off{filter:grayscale(1);opacity:.25;}
.mz-result .msg{font-size:calc(clamp(20px,2.6vw,28px)*var(--mz-scale));}
.mz-actions{display:flex;gap:16px;flex-wrap:wrap;justify-content:center;}
.mz-big{height:84px;min-width:220px;padding:0 30px;border:none;border-radius:999px;color:#fff;font-size:calc(clamp(22px,2.8vw,30px)*var(--mz-scale));display:flex;align-items:center;justify-content:center;gap:10px;}
.mz-big.go{background:var(--mz-ok);box-shadow:0 7px 0 var(--mz-ok-d);}
.mz-big.blue{background:var(--mz-blue);box-shadow:0 7px 0 var(--mz-blue-d);}
.mz-big.gray{background:#868E96;box-shadow:0 7px 0 #5C636A;}
.mz-big:active{transform:translateY(5px);box-shadow:0 2px 0 rgba(0,0,0,.25);}

/* 正解の ○ */
#mzCorrect{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none;z-index:70;opacity:0;}
#mzCorrect.show{animation:mzFade 1.05s ease forwards;}
@keyframes mzFade{0%{opacity:0;}8%{opacity:1;}78%{opacity:1;}100%{opacity:0;}}
#mzCorrect .wrap{position:relative;width:min(260px,55vmin);height:min(260px,55vmin);filter:drop-shadow(0 6px 14px rgba(0,0,0,.18));}
#mzCorrect svg{width:100%;height:100%;transform:rotate(-90deg);}
#mzCorrect circle{fill:rgba(255,255,255,.92);stroke:#E2483D;stroke-width:15;stroke-linecap:round;stroke-dasharray:530;stroke-dashoffset:530;}
#mzCorrect.show circle{animation:mzDraw .5s cubic-bezier(.4,0,.2,1) forwards;}
@keyframes mzDraw{to{stroke-dashoffset:0;}}
#mzCorrect .lb{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:30px;font-weight:900;color:#E2483D;}
.mz-confetti{position:fixed;top:-50px;pointer-events:none;z-index:65;font-family:var(--mz-emoji);animation:mzFall linear forwards;}
@keyframes mzFall{to{transform:translateY(115vh) rotate(var(--r));}}

/* ---------- シート・設定・トースト ---------- */
.mz-modal{position:fixed;inset:0;z-index:80;background:rgba(17,24,39,.55);display:none;align-items:flex-start;justify-content:center;padding:24px 12px;overflow-y:auto;-webkit-user-select:text;user-select:text;}
.mz-modal.open{display:flex;}
.mz-panel{width:min(100%,780px);background:#fff;border-radius:24px;padding:20px clamp(16px,4vw,30px) 26px;font-weight:500;font-size:17px;box-shadow:0 20px 60px rgba(0,0,0,.3);word-break:normal;}
.mz-panel .hd{display:flex;align-items:center;justify-content:space-between;gap:12px;}
.mz-panel h2{margin:0;font-size:23px;font-weight:800;}
.mz-panel h3{margin:24px 0 8px;font-size:18px;font-weight:800;padding-left:10px;border-left:6px solid var(--mz-blue);}
.mz-note{color:var(--mz-sub);font-size:14px;line-height:1.7;margin:6px 0;}
.mz-panel label.row{display:flex;align-items:center;gap:12px;min-height:52px;padding:6px 0;border-bottom:1px solid #F1F3F5;}
.mz-panel label.row>span:first-child{flex:1;}
.mz-panel input[type=checkbox]{width:30px;height:30px;accent-color:var(--mz-ok);}
.mz-panel input[type=range]{width:200px;accent-color:var(--mz-blue);}
.mz-seg{display:flex;gap:8px;flex-wrap:wrap;}
.mz-seg button{flex:1;min-width:110px;padding:11px 8px;font-size:15px;font-weight:800;border-radius:12px;border:2px solid #CED4DA;background:#fff;}
.mz-seg button.on{background:#2E2A25;border-color:#2E2A25;color:#fff;}
.mz-seglabel{margin:12px 0 6px;font-weight:800;font-size:15px;}

.mz-toast.show{display:block;}

.mz-pgo.sub{background:#fff;color:var(--mz-ink);border:3px solid var(--mz-line);box-shadow:0 4px 0 var(--mz-line);height:54px;font-size:18px;margin-top:10px;}

.ws-page{width:210mm;height:297mm;padding:12mm;background:#fff;color:#222;box-sizing:border-box;overflow:hidden;font-family:var(--mz-font);font-weight:700;display:flex;flex-direction:column;-webkit-print-color-adjust:exact;print-color-adjust:exact;word-break:keep-all;overflow-wrap:anywhere;}
.ws-head{flex:none;display:flex;justify-content:space-between;align-items:flex-end;gap:6mm;border-bottom:.8mm solid #222;padding-bottom:3mm;margin-bottom:5mm;}

.ws-cell .v svg{max-height:38mm;width:auto;max-width:100%;}
.ws-opts{display:flex;flex-wrap:wrap;gap:2mm;justify-content:center;}
.ws-opt{border:.35mm solid #444;border-radius:2mm;padding:1.2mm 3mm;font-size:4mm;background:#fff;}
.ws-ans{margin-top:2mm;text-align:center;color:#C92A2A;font-size:3.6mm;}
.ws-line{border-bottom:.35mm solid #333;height:9mm;flex:1;}
.ws-lines .r{display:flex;align-items:flex-end;gap:2mm;margin-top:1mm;}

.ws-tiles{display:flex;flex-wrap:wrap;gap:2mm;justify-content:center;margin-bottom:1mm;}
.ws-tiles span{border:.35mm solid #999;background:#F8F4EA;border-radius:2mm;padding:1mm 3mm;font-size:4mm;}
.ws-box{display:inline-block;min-width:14mm;height:9mm;border:.4mm solid #333;border-radius:1.5mm;vertical-align:middle;}
.ws-ord{display:flex;flex-direction:column;gap:1.8mm;align-items:flex-start;margin:1mm auto 0;width:fit-content;max-width:100%;}
.ws-ord .r{display:flex;align-items:center;gap:3mm;font-size:4.3mm;}
.ws-ord .bx{flex:none;width:10mm;height:10mm;border:.45mm solid #333;border-radius:1.5mm;display:grid;place-items:center;color:#C92A2A;font-size:5mm;}
.ws-page.big .ws-cell{font-size:5.4mm;padding:4mm 5mm;}
.ws-page.big .ws-cell .q{font-size:6.2mm;}
.ws-page.big .ws-opt{font-size:5.4mm;padding:2mm 4mm;}
.ws-page.big .ws-ord .r{font-size:5.6mm;}
.ws-page.big .ws-ord .bx{width:12mm;height:12mm;}
.ws-page.big .ws-cell .v svg{max-height:52mm;}
#mzWorksheet{display:none;}
@page{size:A4 portrait;margin:0;}
@media print{
  html,body{height:auto!important;overflow:visible!important;display:block!important;background:#fff!important;padding:0!important;}

}

    if (!m.levels || m.levels.length <= 1) { startSet(m, m.levels ? m.levels[0].id : 1); return; }

  }

  /* ---------- レベル ---------- */

    setTop(false);

      h('div', { class: 'mz-bar' },
        h('button', { type: 'button', class: 'mz-back', onclick: function () { if (tapOk(400)) renderHome(); } }, '◀ もどる'),
        h('div', { class: 'mz-label' }, emo(m.icon || ''), ' ', m.name),
        h('span', { style: 'width:120px' })),
      h('div', { class: 'mz-levels' }, m.levels.map(function (lv) {
        var r = P[m.id + ':' + lv.id];
        return h('button', {
          type: 'button', class: 'mz-level', style: '--c:' + modeColor(m),

        }, h('span', { class: 'stars' }, lv.stars || ''), h('span', { class: 'nm' }, lv.name),
          r ? h('span', { class: 'best' }, 'さいこう ' + '★'.repeat(r.stars5 || 0) + '☆'.repeat(5 - (r.stars5 || 0))) : null);
      }))

  }

  /* ---------- もんだいの よういの しかた ---------- */
  function makeQueue(m, level) {
    return { m: m, level: level, list: [], used: {} };
  }
  function drawQ(qu) {
    var m = qu.m;
    if (m.pool) {
      if (!qu.list.length) {

        qu.list = shuffle(pool);
        if (qu.last && qu.list.length > 1 && qu.list[0] === qu.last) qu.list.push(qu.list.shift());
      }
      var item = qu.list.shift();

    // make で つくる もんだいは、同じ もんだいが つづかないように する
    var q, key, tries = 0;
    do { q = m.make(qu.level); key = qKey(q); tries++; } while (qu.used[key] && tries < 30);
    qu.used[key] = true;
    return q;
  }
  function qKey(q) { return JSON.stringify([q.text, q.html, q.answer, q.tokens, q.key]); }

  /* ---------- セット（5もん など） ---------- */
  function startSet(m, level) {
    st.mode = m; st.level = level;
    st.set = { n: Number(S.setSize) || 5, i: 0, results: [], queue: makeQueue(m, level) };
    showQ();
  }

  function levelName() {
    var m = st.mode, l = (m.levels || []).filter(function (x) { return x.id === st.level; })[0];
    return m.name + (l && m.levels.length > 1 ? '（' + l.name + '）' : '');
  }

  function showQ() {
    st.screen = 'play';
    setTop(false);
    var m = st.mode, set = st.set;
    var q = drawQ(set.queue);
    set.q = q; set.first = true; set.locked = false;
    var color = modeColor(m);
    var dots = h('div', { class: 'mz-dots', style: '--c:' + color });
    for (var k = 0; k < set.n; k++) dots.appendChild(h('i', { class: k < set.results.length ? set.results[k] : k === set.i ? 'now' : '' }));
    var stage = h('div', { class: 'mz-stage', id: 'mzStage' });
    setView('mz-play', [
      h('div', { class: 'mz-bar' },
        h('button', { type: 'button', class: 'mz-back', onclick: function () { if (!tapOk(400)) return; stopSpeak(); if (m.levels && m.levels.length > 1) renderLevels(m); else renderHome(); } }, '◀ もどる'),
        h('div', { class: 'mz-label' }, levelName()),
        dots,
        h('button', { type: 'button', class: 'mz-say', 'aria-label': 'よみあげ', onclick: function () { if (tapOk(300)) speak(sayOf(q)); } }, emo('🔊'))),
      stage
    ]);
    var kind = q.kind || m.kind || 'choice';
    if (kind === 'choice') renderChoice(stage, q, color);
    else if (kind === 'order') renderOrder(stage, q, color);
    else m.render(stage, q, api(color));
    if (S.autoRead) speak(sayOf(q));
    lock(450);
  }
  function sayOf(q) { return q.say || [q.text, q.sub].filter(Boolean).join('。') || ''; }

  /* ---------- えらぶ もんだい ---------- */
  function qCard(q, color, compact) {
    return h('div', { class: 'mz-q' + (compact ? ' compact' : ''), style: '--c:' + color },
      q.icon ? emo(q.icon, 'qi' + (q.bigIcon ? ' big' : '')) : null,
      q.html ? h('div', { class: 'qv', html: q.html }) : null,
      q.text ? h('div', { class: 'qt' }, q.text) : null,
      q.sub ? h('div', { class: 'qs' }, q.sub) : null);
  }
  function optObj(o) { return typeof o === 'object' ? { label: o.label, value: o.value !== undefined ? o.value : o.label, icon: o.icon, html: o.html, say: o.say } : { label: String(o), value: o }; }
  function renderChoice(stage, q, color) {
    var opts = (q.keepOrder ? q.options : shuffle(q.options)).map(optObj);
    var longest = Math.max.apply(null, opts.map(function (o) { return (o.label || '').length; }));
    var n = opts.length, cols;
    if (q.cols) cols = q.cols;
    else if (opts.some(function (o) { return o.html; })) cols = n <= 4 ? n : 3;
    else if (n === 2) cols = 2;
    else if (n === 3) cols = longest <= 7 ? 3 : 1;
    else if (n === 4) cols = longest <= 4 ? 4 : longest <= 14 ? 2 : 1;
    else cols = longest <= 8 ? 3 : 2;
    if (window.innerWidth < window.innerHeight && cols > 2 && longest > 4) cols = n === 3 ? 1 : 2;
    var side = q.side && window.innerWidth > window.innerHeight;
    if (side) cols = 1;
    var grid = h('div', { class: 'mz-opts', style: '--cols:' + cols });
    opts.forEach(function (o) {
      var b = h('button', { type: 'button', class: 'mz-opt' + (o.icon && cols >= 3 ? ' stack' : ''), style: '--c:' + color },
        o.icon ? emo(o.icon) : null, o.html ? h('span', { html: o.html }) : null, o.label && !o.html ? h('span', null, o.label) : null);
      b.addEventListener('click', function () {
        if (st.set.locked || Date.now() < lockUntil) return;
        if (o.value === q.answer) {
          b.classList.add('ok');
          $$('.mz-opt', grid).forEach(function (x) { if (x !== b) x.classList.add('dim'); });
          correct(q.sayAnswer || o.say || o.label, q.explain);
        } else {
          b.classList.remove('ng'); void b.offsetWidth; b.classList.add('ng');
          wrong();
          if (S.errorless) setTimeout(function () { b.classList.add('gone'); }, 450);
        }
      });
      grid.appendChild(b);
    });
    if (side) stage.append(h('div', { class: 'mz-side' }, qCard(q, color), h('div', { class: 'mz-sidep' }, q.ask ? h('div', { class: 'mz-ask', html: q.ask }) : null, grid)));
    else { stage.append(qCard(q, color)); if (q.ask) stage.append(h('div', { class: 'mz-ask', html: q.ask })); stage.append(grid); }
  }

  /* ---------- ならべる もんだい ---------- */
  function renderOrder(stage, q, color) {
    var tokens = q.tokens.map(function (t, i) { return { t: t, i: i }; });
    var pool = shuffle(tokens), guard = 0;
    while (pool.length > 1 && pool.every(function (x, i) { return x.i === i; }) && guard++ < 20) pool = shuffle(tokens);
    var placed = [];
    var vertical = q.vertical !== undefined ? q.vertical : Math.max.apply(null, q.tokens.map(function (t) { return String(t).length; })) > 8;
    var slots = h('div', { class: 'mz-slots' + (vertical ? ' col' : ''), style: '--c:' + color });
    var poolEl = h('div', { class: 'mz-pool' });
    var hint = h('div', { class: 'mz-hint' }, 'ばんごうの じゅんに タップして ならべよう');
    function draw() {
      slots.innerHTML = ''; poolEl.innerHTML = '';
      tokens.forEach(function (_, k) {
        var tk = placed[k];
        slots.appendChild(h('button', {
          type: 'button', class: 'mz-slot' + (tk ? ' filled' : ''), style: '--c:' + color,
          onclick: function () { if (!tk || st.set.locked) return; placed.splice(k, 1); pool.push(tk); sfx.tap(); draw(); }
        }, h('span', { class: 'no' }, k + 1), tk ? tk.t : ''));
      });
      pool.forEach(function (tk) {
        poolEl.appendChild(h('button', {
          type: 'button', class: 'mz-tile', style: '--c:' + color,
          onclick: function () {
            if (st.set.locked) return;
            pool.splice(pool.indexOf(tk), 1); placed.push(tk); sfx.put(placed.length - 1); speak(tk.t); draw();
            if (!pool.length) check();
          }
        }, tk.t));
      });
    }
    function check() {
      // おなじ もじが 2つ ある ときも、もじが あっていれば せいかい
      var ok = placed.every(function (tk, k) { return tk.t === q.tokens[k]; });
      var els = $$('.mz-slot', slots);
      if (ok) { els.forEach(function (e) { e.classList.add('ok'); }); correct(q.sayAnswer || q.tokens.join('、'), q.explain); return; }
      wrong();
      // あっている ところは のこして、ちがう ところだけ もどす
      var keep = 0;
      while (keep < placed.length && placed[keep].t === q.tokens[keep]) keep++;
      els.forEach(function (e, k) { if (k >= keep) e.classList.add('ng'); });
      st.set.locked = true;
      setTimeout(function () {
        var back = placed.splice(keep);
        pool = pool.concat(shuffle(back));
        st.set.locked = false;
        draw();
      }, 700);
    }
    draw();
    if (vertical) {
      stage.append(qCard({ icon: q.icon, text: q.text, sub: q.sub, html: q.html }, color, true), hint,
        h('div', { class: 'mz-ow' }, slots, poolEl));
    } else {
      stage.append(qCard({ icon: q.icon, text: q.text, sub: q.sub, html: q.html }, color), slots, hint, poolEl);
    }
  }

  // えらんだ ものを つけたり はずしたり（さいごの 1つは のこす）
  function toggleIn(arr, v) {
    arr = (arr || []).slice();
    var i = arr.indexOf(v);
    if (i >= 0) { if (arr.length > 1) arr.splice(i, 1); } else arr.push(v);
    return arr;
  }

  /* ---------- なぞりがき（うすい もじを なぞる・かたちの うえを なぞれたか はんてい） ---------- */
  var TRACE_FONT = '"Klee One","UD デジタル 教科書体 NK-R","UD Digital Kyokasho NK-R","UD デジタル 教科書体 N-R","YuKyokasho Yoko","Hiragino Maru Gothic ProN","M PLUS Rounded 1c",sans-serif';
  var ROUND_FONT = '"Hiragino Maru Gothic ProN","M PLUS Rounded 1c","BIZ UDPGothic","Yu Gothic UI",sans-serif';
  function trace(stage, api, txt, o) {
    o = o || {};
    var n = [].slice.call(txt).length;
    var H = 380, W = Math.round(H * Math.max(1, n * (o.textbook ? 0.9 : 0.72)));
    var wrap = h('div', { class: 'trace', style: '--ar:' + (W / H) });
    var guide = h('canvas', { width: W, height: H, class: 'tg' });
    var ink = h('canvas', { width: W, height: H, class: 'ti' });
    wrap.append(guide);
    if (o.grid && n === 1) wrap.append(h('span', { class: 'gridl' }));
    wrap.append(ink);
    var msg = h('div', { class: 'tmsg' }, o.msg || 'うすい もじを ゆびで なぞろう');
    var done = false;
    var bar = h('div', { class: 'tbar' },
      h('button', { type: 'button', class: 'tbtn', onclick: clear }, '🧽 けす'),
      h('button', { type: 'button', class: 'tbtn ok', onclick: function () { judge(true); } }, '✅ できた'));
    stage.append(o.head || null, msg, wrap, bar);
    var g = guide.getContext('2d'), k = ink.getContext('2d');
    var fs = Math.min(H * 0.84, W / n * 1.02), gd = null, pts = [];
    var font = (o.textbook ? '600 ' : '900 ') + fs + 'px ' + (o.textbook ? TRACE_FONT : ROUND_FONT);
    // フォントが よみこまれてから かく（まにあわない ときは 1.5びょうで あきらめる）
    var drawn = false;
    function drawGuide() {
      if (drawn) return; drawn = true;
    g.font = font;
    g.textAlign = 'center'; g.textBaseline = 'middle';
    var y0 = H / 2 + fs * 0.04;
    if (o.textbook) {
      // 教科書体は ほそいので ふちどりして ふとく する
      g.lineJoin = 'round'; g.lineWidth = fs * 0.07; g.strokeStyle = '#EFE7D6'; g.strokeText(txt, W / 2, y0);
    }
    g.fillStyle = '#EFE7D6'; g.fillText(txt, W / 2, y0);
    if (!o.textbook) { g.setLineDash([8, 10]); g.lineWidth = 3; g.strokeStyle = '#C9B99A'; g.strokeText(txt, W / 2, y0); }
    gd = g.getImageData(0, 0, W, H).data;
    for (var y = 0; y < H; y += 5) for (var x = 0; x < W; x += 5) { var i = (y * W + x) * 4; if (gd[i + 3] > 200) pts.push([x, y]); }
    if (o.textbook) { g.fillStyle = '#B9AC93'; g.fillText(txt, W / 2, y0); }
    }
    try { document.fonts.load(font, txt).then(drawGuide, drawGuide); } catch (e) { drawGuide(); }
    setTimeout(drawGuide, 1500);
    k.lineCap = 'round'; k.lineJoin = 'round'; k.lineWidth = Math.round(fs * (o.textbook ? 0.12 : 0.16)); k.strokeStyle = api.color; k.fillStyle = api.color;
    var down = false, last = null;
    function pos(e) { var r = ink.getBoundingClientRect(); return [(e.clientX - r.left) * W / r.width, (e.clientY - r.top) * H / r.height]; }
    ink.addEventListener('pointerdown', function (e) { if (done) return; e.preventDefault(); try { ink.setPointerCapture(e.pointerId); } catch (x) { /* 無視 */ } down = true; last = pos(e); k.beginPath(); k.arc(last[0], last[1], k.lineWidth / 2, 0, 7); k.fill(); });
    ink.addEventListener('pointermove', function (e) { if (!down) return; var p = pos(e); k.beginPath(); k.moveTo(last[0], last[1]); k.lineTo(p[0], p[1]); k.stroke(); last = p; });
    function up() { if (!down) return; down = false; judge(false); }
    ink.addEventListener('pointerup', up); ink.addEventListener('pointercancel', up);
    function clear() { if (done) return; k.clearRect(0, 0, W, H); msg.textContent = o.msg || 'うすい もじを ゆびで なぞろう'; }
    function judge(pressed) {
      if (done || !gd) return;
      var d = k.getImageData(0, 0, W, H).data, hit = 0;
      pts.forEach(function (p) { if (d[(p[1] * W + p[0]) * 4 + 3] > 50) hit++; });
      var cover = pts.length ? hit / pts.length : 0, inkN = 0, out = 0;
      for (var y = 0; y < H; y += 8) for (var x = 0; x < W; x += 8) { var i = (y * W + x) * 4; if (d[i + 3] > 50) { inkN++; if (gd[i + 3] < 30) out++; } }
      var over = inkN ? out / inkN : 0;
      var need = S.traceEasy ? 0.35 : 0.5;
      if (cover >= (pressed ? need : need + 0.22) && over < 0.6) { done = true; msg.textContent = 'じょうずに かけたね！'; api.correct(o.say || txt); }
      else if (pressed) { msg.textContent = over >= 0.6 ? 'はみださないように なぞろう' : 'もうすこし なぞってみよう'; speak(msg.textContent); }
    }
  }

  /* ---------- すうじキー ---------- */
  function numpad(onKey, o) {
    o = o || {};
    var keys = ['7', '8', '9', '4', '5', '6', '1', '2', '3', 'del', '0', o.extra || ''];
    return h('div', { class: 'mz-pad' }, keys.map(function (k) {
      if (!k) return h('span');
      var lab = k === 'del' ? '⌫' : k === 'next' ? '➡' : k === 'ok' ? '✔' : k;
      return h('button', { type: 'button', class: 'mz-rep' + (k.length > 1 ? ' fn ' + k : ''), 'aria-label': k === 'del' ? 'けす' : k === 'next' ? 'つぎ' : k, onclick: function () { sfx.tap(); onKey(k); } }, lab);
    }));
  }

  /* ---------- せいかい・まちがい ---------- */
  function correct(sayText, explain) {
    var set = st.set;
    if (set.locked) return;
    set.locked = true;
    set.results[set.i] = set.first ? 'ok' : 'miss';
    sfx.ok(); showCorrect();
    var praise = pick(PRAISE);
    speak(sayText ? sayText + '。' + praise : praise);
    var stage = $('#mzStage');
    stage.classList.add('answered');
    if (explain) {
      var ex = h('div', { class: 'mz-explain' }, '💡 ' + explain);
      stage.appendChild(ex);
      setTimeout(function () { try { ex.scrollIntoView({ block: 'nearest', behavior: 'smooth' }); } catch (e) { /* 無視 */ } }, 50);
    }
    var dots = $$('.mz-dots i');
    if (dots[set.i]) dots[set.i].className = set.results[set.i];
    lock(700);
    var last = set.i >= set.n - 1;
    var nb = h('button', { type: 'button', class: 'mz-next', onclick: function () { if (tapOk(600)) goNext(); } }, last ? 'おわり ▶' : 'つぎへ ▶');
    setTimeout(function () { if (st.screen === 'play' && st.set === set) stage.appendChild(nb); }, 650);
    if (S.autoNext) setTimeout(function () { if (st.screen === 'play' && st.set === set && document.body.contains(nb)) goNext(); }, 2600);
  }
  function wrong() {
    st.set.first = false;
    sfx.ng();
    speak(pick(TRY));
  }
  function goNext() {
    var set = st.set;
    set.i++;
    if (set.i >= set.n) renderResult(); else showQ();
  }
  function api(color) {
    return {
      color: color, speak: speak, sfx: sfx, h: h, emo: emo, shuffle: shuffle, pick: pick,
      correct: function (sayText, explain) { correct(sayText, explain); },
      wrong: function () { wrong(); },
      locked: function () { return st.set.locked || Date.now() < lockUntil; },
      tapOk: tapOk,
      settings: function () { return S; },
      // custom の なかで ふつうの「えらぶ もんだい」を つかう
      choice: function (stage, q) { renderChoice(stage, q, color); },

  }

  /* ---------- けっか ---------- */
  function renderResult() {
    st.screen = 'result';
    var set = st.set, m = st.mode;
    var ok = set.results.filter(function (r) { return r === 'ok'; }).length;
    var stars5 = Math.round(ok / set.n * 5);
    var key = m.id + ':' + st.level;
    var prev = P[key] || {};
    P[key] = { stars5: Math.max(prev.stars5 || 0, stars5), plays: (prev.plays || 0) + 1 };
    save('mieel.' + A.id + '.progress', P);
    var msg = ok === set.n ? 'ぜんぶ いっかいで せいかい！ すごい！' : ok >= set.n / 2 ? 'よく がんばったね！' : 'さいごまで できたね！ また チャレンジしよう';
    var stars = h('div', { class: 'big-stars' });
    for (var k = 0; k < 5; k++) stars.appendChild(h('span', { class: 'mz-emoji' + (k < stars5 ? '' : ' off') }, '⭐'));
    setView('mz-res', [h('div', { class: 'mz-result' },
      h('h2', null, 'できた！'),
      stars,
      h('div', { class: 'msg' }, set.n + 'もん ちゅう ' + ok + 'もん いっかいで せいかい'),
      h('div', { class: 'msg', style: 'font-size:.85em;color:var(--mz-sub)' }, msg),
      h('div', { class: 'mz-actions' },
        h('button', { type: 'button', class: 'mz-big go', onclick: function () { if (tapOk(500)) startSet(m, st.level); } }, '🔄 もういちど'),
        m.levels && m.levels.length > 1 ? h('button', { type: 'button', class: 'mz-big blue', onclick: function () { if (tapOk(500)) renderLevels(m); } }, '⭐ レベルを かえる') : null,
        h('button', { type: 'button', class: 'mz-big gray', onclick: function () { if (tapOk(500)) renderHome(); } }, '🏠 ホーム')))]);
    sfx.fanfare(); confetti();
    speak('できた！ ' + msg);
    lock(1200);
  }

  /* ---------- プリント（先生用） ---------- */
  var pr = null;
  function printModes() { return A.modes.filter(function (m) { return m.print !== false; }); }
  function renderPrint() {
    st.screen = 'print';
    stopSpeak();
    setTop(false);
    var modes = printModes();
    if (!pr) pr = load('mieel.' + A.id + '.print') || {};
    if (!modes.some(function (m) { return m.id === pr.mode; })) pr.mode = modes[0].id;
    var m = modes.filter(function (x) { return x.id === pr.mode; })[0];
    var levels = m.levels || [{ id: 1, name: 'ふつう' }];
    if (!levels.some(function (l) { return l.id === pr.level; })) pr.level = levels[0].id;
    var cl = (m.print && m.print.counts) || [[4], [6], [8], [10], [12]];
    if (!cl.some(function (c) { return c[0] === Number(pr.count); })) pr.count = (m.print && m.print.defCount) || (cl.length > 1 ? cl[1][0] : cl[0][0]);
    save('mieel.' + A.id + '.print', pr);
    var set = function (k, v, regen) { pr[k] = v; if (regen !== false) pr.seed = null; renderPrint(); };
    var old = $('.mz-pctrl'), keep = old ? old.scrollTop : 0;
    var chips = function (list, cur, on) { return h('div', { class: 'mz-chips' }, list.map(function (o) { return h('button', { type: 'button', class: 'mz-chip' + (String(o[0]) === String(cur) ? ' on' : ''), onclick: function () { on(o[0]); } }, o[1]); })); };
    var ctrl = h('div', { class: 'mz-pctrl' },
      h('div', { class: 'lab' }, 'もんだいの しゅるい'),
      chips(modes.map(function (x) { return [x.id, (x.icon ? x.icon + ' ' : '') + x.name]; }), pr.mode, function (v) { set('mode', v); }),
      levels.length > 1 ? [h('div', { class: 'lab' }, 'レベル'), chips(levels.map(function (l) { return [l.id, (l.stars ? l.stars + ' ' : '') + l.name]; }), pr.level, function (v) { set('level', v); })] : null,
      (A.options || []).filter(function (o) { return o.print || o.printOnly; }).map(function (o) {
        if (o.type === 'multi') {
          return [h('div', { class: 'lab' }, o.label), h('div', { class: 'mz-chips' }, o.opts.map(function (x) {
            var on = (S[o.key] || []).indexOf(x[0]) >= 0;
            return h('button', { type: 'button', class: 'mz-chip' + (on ? ' on' : ''), onclick: function () { S[o.key] = toggleIn(S[o.key], x[0]); saveS(); set('opt', null, !!o.regen); } }, x[1]);

    ['🍎', 'りんご', 100], ['🧃', 'ジュース', 100], ['📓', 'ノート', 110], ['🥛', 'ぎゅうにゅう', 120], ['🍙', 'おにぎり', 130], ['🍞', 'パン', 150], ['🍦', 'アイス', 150], ['🥚', 'たまご', 200], ['🍱', 'おべんとう', 450]
  ];

  // ねだんに あう しなもの（10えんまで／100えんまで／それより たかい）
  var CHEAP = [['🍬', 'あめ'], ['🍭', 'キャンディ'], ['🍘', 'おせんべい'], ['🍡', 'だんご']];
  var MID = [['🍬', 'おかし'], ['✏️', 'えんぴつ'], ['🧽', 'けしごむ'], ['🍪', 'クッキー'], ['🍌', 'バナナ'], ['🧃', 'ジュース'], ['🥕', 'にんじん']];
  var HIGH = [['🍱', 'おべんとう'], ['📕', 'ほん'], ['🧸', 'ぬいぐるみ'], ['🍰', 'ケーキ'], ['🧢', 'ぼうし'], ['🖍️', 'クレヨン'], ['🍞', 'パン']];

  /* ---------- レベル ---------- */
  var LV = [{ id: 1, name: '1・5・10えん', stars: '★☆☆☆' }, { id: 2, name: '10・50・100えん', stars: '★★☆☆' }, { id: 3, name: '100・500・1000えん', stars: '★★★☆' }, { id: 4, name: 'ぜんぶ', stars: '★★★★' }];
  var KINDS = { 1: [1, 5, 10], 2: [10, 50, 100], 3: [100, 500, 1000], 4: [1, 5, 10, 50, 100, 500, 1000] };
  var WALLET = { 1: [1, 5, 10], 2: [1, 5, 10, 50, 100], 3: [10, 50, 100, 500, 1000], 4: [1, 5, 10, 50, 100, 500, 1000] };
  function price(lv) {
    if (lv === 1) return rand(2, 10);
    if (lv === 2) return rand(2, 10) * 10;
    if (lv === 3) return rand(11, 99) * 10;
    return rand(20, 999);
  }

  /* ---------- ちょうど はらおう（さいふから だす） ---------- */
  function payUI(stage, api, target, lv, head, onOk) {
    var h = api.h, tray = [], wallet = WALLET[lv];
    var trayEl = h('div', { class: 'tray' });
    var sum = h('div', { class: 'tsum' });
    var walletEl = h('div', { class: 'wallet' });
    wallet.forEach(function (v) {
      var b = h('button', { type: 'button', class: 'wm mz-rep', html: money(v, BILL[v] ? .85 : 1), 'aria-label': v + 'えん' });
      b.addEventListener('click', function () { if (api.locked()) return; tray.push(v); api.sfx.put(tray.length); api.speak(sayYen(v), 1.1); draw(); });
      walletEl.appendChild(b);
    });
    function total() { return tray.reduce(function (a, b) { return a + b; }, 0); }
    function draw() {
      trayEl.innerHTML = '';
      if (!tray.length) trayEl.appendChild(h('span', { class: 'tempty' }, 'ここに おかねを だそう'));
      tray.slice().sort(function (a, b) { return b - a; }).forEach(function (v) {
        var b = h('button', { type: 'button', class: 'tm', html: money(v, BILL[v] ? .6 : .7) });
        b.addEventListener('click', function () { if (api.locked()) return; tray.splice(tray.indexOf(v), 1); api.sfx.tap(); draw(); });
        trayEl.appendChild(b);
      });
      sum.textContent = opt('showSum') === false ? '' : 'だした おかね：' + yen(total());
    }
    var payBtn = h('button', { type: 'button', class: 'paybtn', onclick: function () {
      if (api.locked()) return;
      var t = total();
      if (t === target) { box.classList.add('done'); onOk(); }
      else { api.wrong(); var m = t < target ? 'たりないよ。もう すこし だそう' : 'おおいよ。ちょうどに しよう'; sum.textContent = '💡 ' + m; setTimeout(function () { api.speak(m); }, 600); }
    } }, '💴 これで はらう');
    var box = h('div', { class: 'paybox' }, head, h('div', { class: 'traybox' }, trayEl, sum), h('div', { class: 'wtitle' }, '👛 さいふ（タップして だす）'), walletEl, payBtn);
    draw();
    stage.appendChild(box);
  }

  var modes = {
    coin: {
      id: 'coin', name: 'こうか', sub: 'なんえん かな？', icon: '🪙', color: '#C98A2E', levels: LV.slice(0, 3).concat([{ id: 4, name: '5000・10000えんも', stars: '★★★★' }]), kind: 'choice',
      make: function (lv) {
        var pool = lv === 4 ? [1000, 5000, 10000, 500, 100] : KINDS[lv], v = pick(pool);
        var os = shuffle(pool).slice(0, 3); if (os.indexOf(v) < 0) os[0] = v;
        return { html: '<div class="big1">' + money(v, BILL[v] ? 1.6 : 2) + '</div>', sub: 'これは なんえん？', say: 'これは なんえん？', options: os.map(function (x) { return { label: yen(x), value: x, say: sayYen(x) }; }), answer: v, sayAnswer: sayYen(v), key: 'c' + v + Math.random().toString(36).slice(2, 4), v: v };
      },
      print: false
    },
    sum: {
      id: 'sum', name: 'いくらかな', sub: 'ぜんぶで いくら？', icon: '💰', color: '#2F9E44', levels: LV, kind: 'choice',
      make: function (lv) {
        var n = lv === 1 ? rand(2, 3) : lv === 4 ? rand(3, 5) : rand(2, 4), cs = [];
        for (var i = 0; i < n; i++) cs.push(pick(KINDS[lv]));
        cs.sort(function (a, b) { return b - a; });
        var t = cs.reduce(function (a, b) { return a + b; }, 0);
        return { html: '<div class="coins">' + cs.map(function (v) { return money(v, BILL[v] ? .9 : 1); }).join('') + '</div>', sub: 'ぜんぶで いくら？', say: 'ぜんぶで いくら？', options: numOpts(t, KINDS[lv][0], 4).map(function (x) { return { label: yen(x), value: x, say: sayYen(x) }; }), answer: t, sayAnswer: 'ぜんぶで ' + sayYen(t), key: cs.join(','), cs: cs, t: t };
      },
      print: {
        instruction: 'ぜんぶで いくらかな？', cols: 2, noNum: true, counts: [[4, '4もん'], [6, '6もん'], [8, '8もん']], defCount: 6,
        cell: function (q, ans) { return '<div class="pcs">' + q.cs.map(function (v) { return money(v, BILL[v] ? .45 : .5); }).join('') + '</div><div class="pa">ぜんぶで <span class="pbl">' + (ans ? q.t : '') + '</span> えん</div>'; }
      }
    },
    pay: {
      id: 'pay', name: 'ちょうど はらおう', sub: 'さいふから だそう', icon: '👛', color: '#1C7ED6', levels: LV, kind: 'custom',
      make: function (lv) {
        var p = price(lv), it = pick(p <= 10 ? CHEAP : p <= 100 ? MID : HIGH);
        return { p: p, it: it, lv: lv, key: it[1] + p, say: it[1] + ' は ' + sayYen(p) + '。ちょうど はらおう' };
      },
      render: function (stage, q, api) {
        var h = api.h;
        payUI(stage, api, q.p, q.lv, h('div', { class: 'mz-q item', style: '--c:' + api.color }, h('span', { class: 'mz-emoji ie' }, q.it[0]), h('div', null, h('div', { class: 'in' }, q.it[1]), h('div', { class: 'ip' }, yen(q.p)))),
          function () { api.correct(sayYen(q.p) + '、ちょうど はらえたね'); });
      },
      print: {
        instruction: 'ちょうど はらう おかねを かこう（〇で かこんでも いいよ）', cols: 2, noNum: true, counts: [[4, '4もん'], [6, '6もん']], defCount: 4,
        cell: function (q, ans) { return '<div class="pit"><span class="mz-emoji">' + q.it[0] + '</span><b>' + yen(q.p) + '</b></div><div class="pcs">' + (ans ? split(q.p, WALLET[q.lv]).map(function (v) { return money(v, BILL[v] ? .4 : .45); }).join('') : WALLET[q.lv].map(function (v) { return money(v, BILL[v] ? .4 : .45); }).join('')) + '</div>'; }
      }
    },
    change: {
      id: 'change', name: 'おつり', sub: 'いくら もどる？', icon: '🔄', color: '#E8590C', levels: [{ id: 1, name: '10えんで はらう', stars: '★☆☆' }, { id: 2, name: '100えんで はらう', stars: '★★☆' }, { id: 3, name: '1000えんで はらう', stars: '★★★' }], kind: 'choice',
      make: function (lv) {
        var paid = [10, 100, 1000][lv - 1], p = lv === 1 ? rand(1, 9) : lv === 2 ? rand(1, 9) * 10 : rand(2, 19) * 50, it = pick(lv === 1 ? CHEAP : lv === 2 ? MID : HIGH), ch = paid - p;
        return {
          html: '<div class="chg"><div class="pitem"><span class="mz-emoji">' + it[0] + '</span><b>' + yen(p) + '</b></div><div class="parr">⬅</div><div class="pitem">' + money(paid, lv === 3 ? 1 : 1.2) + '<b>で はらう</b></div></div>' + (opt('showSum') === false ? '' : '<div class="chint">' + yen(paid) + ' － ' + yen(p) + ' ＝ ？</div>'),
          sub: 'おつりは いくら？', say: it[1] + ' は ' + sayYen(p) + '。' + sayYen(paid) + ' で はらうと、おつりは いくら？',
          options: numOpts(ch, lv === 1 ? 1 : lv === 2 ? 10 : 50, 4).map(function (x) { return { label: yen(x), value: x, say: sayYen(x) }; }), answer: ch, sayAnswer: 'おつりは ' + sayYen(ch), key: p + '/' + paid, p: p, paid: paid, it: it
        };
      },
      print: {
        instruction: 'おつりは いくらかな？', cols: 2, noNum: true, counts: [[4, '4もん'], [6, '6もん'], [8, '8もん']], defCount: 6,
        cell: function (q, ans) { return '<div class="pit"><span class="mz-emoji">' + q.it[0] + '</span><b>' + yen(q.p) + '</b>　を　' + money(q.paid, .45) + '　で かう</div><div class="pa">おつり <span class="pbl">' + (ans ? q.paid - q.p : '') + '</span> えん</div>'; }
      }
    },
    shop: {
      id: 'shop', name: 'おみせで かおう', sub: 'リストの ものを かって はらう', icon: '🛒', color: '#7048E8',
      levels: [{ id: 1, name: '1こ かう', stars: '★☆☆' }, { id: 2, name: '2こ かう', stars: '★★☆' }, { id: 3, name: '3こ かう', stars: '★★★' }], kind: 'custom',
      make: function (lv) {
        var shelf = shuffle(ITEMS.filter(function (x) { return x[2] <= (lv === 1 ? 100 : 200); })).slice(0, 6), list = shelf.slice(0, lv);
        return { shelf: shuffle(shelf), list: list, lv: lv, key: list.map(function (x) { return x[1]; }).join(','), say: 'かいもの リストの ものを かごに いれよう。' + list.map(function (x) { return x[1]; }).join('と') };
      },
      render: function (stage, q, api) {
        var h = api.h, cart = [];
        var listEl = h('div', { class: 'slist' }, h('b', null, '📝 かいもの リスト'), q.list.map(function (x) { return h('div', { class: 'li', 'data-n': x[1] }, h('span', { class: 'mz-emoji' }, x[0]), ' ' + x[1]); }));
        var shelfEl = h('div', { class: 'shelf' });
        var info = h('div', { class: 'tsum' }, 'たなから えらんで かごに いれよう');
        q.shelf.forEach(function (x) {
          var b = h('button', { type: 'button', class: 'si' }, h('span', { class: 'mz-emoji' }, x[0]), h('span', { class: 'sn' }, x[1]), h('span', { class: 'sp' }, yen(x[2])));
          b.addEventListener('click', function () {
            if (api.locked() || b.classList.contains('in')) return;
            if (q.list.indexOf(x) < 0) { b.classList.remove('ng'); void b.offsetWidth; b.classList.add('ng'); api.wrong(); info.textContent = '💡 ' + x[1] + ' は リストに ないよ'; return; }
            b.classList.add('in'); cart.push(x); api.sfx.put(cart.length); api.speak(x[1]);
            listEl.querySelector('[data-n="' + x[1] + '"]').classList.add('ok');
            if (cart.length === q.list.length) setTimeout(pay, 700);
          });
          shelfEl.appendChild(b);
        });
        var wrap = h('div', { class: 'shopbox' }, listEl, h('div', { class: 'shr' }, info, shelfEl));
        stage.appendChild(wrap);
        function pay() {
          var tot = cart.reduce(function (a, b) { return a + b[2]; }, 0);
          stage.innerHTML = '';
          api.speak('ぜんぶで ' + sayYen(tot) + '。ちょうど はらおう');
          payUI(stage, api, tot, 4, h('div', { class: 'mz-q item', style: '--c:' + api.color }, h('div', { class: 'cartl' }, cart.map(function (x) { return h('span', { class: 'mz-emoji' }, x[0]); })), h('div', null, h('div', { class: 'in' }, 'ぜんぶで'), h('div', { class: 'ip' }, yen(tot)))),
            function () { api.correct('かいもの できたね'); });
        }
      },
      print: false
    }
  };

  var order = VARIANT === 'okane2' ? ['shop', 'pay', 'change', 'sum', 'coin'] : ['coin', 'sum', 'pay', 'change', 'shop'];
  MieelApp.start({
    id: VARIANT,
    title: VARIANT === 'okane2' ? 'おかいものを しよう' : 'おかねの がくしゅう',
    icon: VARIANT === 'okane2' ? '🛒' : '🪙',
    color: '#C98A2E', colorD: '#8F6118', soft: '#F8EBD2',
    homeTitle: 'なにを する？',
    teacherNote:
      '算数・生活単元学習の「お金」の教材です。<br>' +
      '・<b>こうか</b>：お金を見て、なんえんかを選びます（硬貨の大きさは実物の比に近づけています）。<br>' +
      '・<b>いくらかな</b>：ならんだお金の合計を選びます。<br>' +
      '・<b>ちょうど はらおう</b>：さいふのお金をタップして トレーに出し、ちょうどの金額を はらいます（出したお金をタップすると もどせます）。<br>' +
      '・<b>おつり</b>：10円・100円・1000円で はらったときの おつりを選びます。<br>' +
      '・<b>おみせで かおう</b>：かいものリストの ものを たなから えらび、合計を ちょうど はらいます。<br>' +
      '・「だした おかねの ごうけいを ひょうじ」を切ると、合計を自分で数える練習になります。',
    options: [
      { key: 'showSum', label: '💴 だした おかねの ごうけい・しきを ひょうじ（たすけ）', type: 'check', def: true }
    ],
    modes: order.map(function (k) { return modes[k]; })
  });
})();
</script>
