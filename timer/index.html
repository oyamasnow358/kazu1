<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="タイマー">
<meta name="theme-color" content="#FAF7EF">
<title>みえる タイマー｜MieeL</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#FAF7EF; --card:#fff; --ink:#2E2A25; --sub:#7D7466; --line:#EAE1CE;
    --pie:#E03131; --pie2:#FFE3E3; --ok:#2F9E44; --ok-d:#237A34; --blue:#1C7ED6;
    --mieel:radial-gradient(circle at 50% 0%,#1B8FE8 0%,#2BB8D6 28%,#3FCB9E 45%,#8FD24A 58%,#F4D027 72%,#F7941E 100%);
    --font:"M PLUS Rounded 1c","Hiragino Maru Gothic ProN","BIZ UDPGothic","Yu Gothic UI",sans-serif;
    --emoji:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif;
  }
  body.dark{--bg:#15171A; --card:#22262B; --ink:#F1F3F5; --sub:#ADB5BD; --line:#343A40; --pie2:#3B2426;}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;height:100%;}
  body{background:var(--bg);color:var(--ink);font-family:var(--font);font-weight:700;-webkit-user-select:none;user-select:none;touch-action:manipulation;
    display:flex;flex-direction:column;height:100vh;height:100dvh;overflow:hidden;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);}
  button{font-family:inherit;font-weight:inherit;color:inherit;cursor:pointer;}
  .emo{font-family:var(--emoji);font-weight:400;}
  header{flex:none;display:flex;align-items:center;gap:10px;padding:8px 16px;min-height:62px;}
  .brand{display:flex;align-items:center;gap:7px;font-size:15px;}
  .orb{width:22px;height:22px;border-radius:50%;background:var(--mieel);}
  .brand .u{font-size:12px;color:var(--sub);font-weight:500;}
  .ttl{flex:1;text-align:center;font-size:clamp(18px,2.3vw,24px);}
  .tb{width:52px;height:52px;border-radius:50%;border:3px solid var(--line);background:var(--card);font-size:24px;display:grid;place-items:center;}
  main{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1.25fr) minmax(300px,.75fr);gap:20px;padding:0 20px 18px;}
  .left{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;min-height:0;}
  .task{display:flex;align-items:center;gap:12px;font-size:clamp(26px,4vh,40px);min-height:1.4em;}
  .task .emo{font-size:1.4em;}
  .dial{position:relative;width:min(100%,62vh);aspect-ratio:1;}
  .dial svg{width:100%;height:100%;display:block;}
  .left .time{font-size:clamp(40px,8vh,76px);letter-spacing:2px;font-variant-numeric:tabular-nums;line-height:1.1;}
  .left .time.hide{visibility:hidden;}
  .msg{font-size:clamp(18px,2.6vh,24px);color:var(--sub);min-height:1.4em;}
  .right{display:flex;flex-direction:column;gap:12px;overflow-y:auto;padding:4px;}
  .panel{background:var(--card);border:4px solid var(--line);border-radius:24px;padding:12px 14px;}
  .panel h3{margin:0 0 8px;font-size:15px;color:var(--sub);}
  .chips{display:flex;flex-wrap:wrap;gap:8px;}
  .chip{min-width:74px;height:54px;padding:0 12px;border-radius:16px;border:3px solid var(--line);background:var(--bg);font-size:20px;}
  .chip.on{border-color:var(--pie);background:var(--pie2);}
  .adj{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap;}
  .adj button{flex:1;min-width:70px;height:50px;border-radius:14px;border:3px solid var(--line);background:var(--bg);font-size:17px;}
  .acts{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;}
  .act{height:74px;border-radius:16px;border:3px solid var(--line);background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:13px;gap:2px;}
  .act .emo{font-size:28px;}
  .act.on{border-color:var(--blue);background:#DCEBFA;}
  body.dark .act.on{background:#1B3350;}
  .big{display:flex;gap:12px;}
  .go{flex:1;height:88px;border:none;border-radius:999px;background:var(--ok);color:#fff;font-size:30px;box-shadow:0 7px 0 var(--ok-d);}
  .go.pause{background:#F59F00;box-shadow:0 7px 0 #C77C02;}
  .rs{width:110px;height:88px;border-radius:999px;border:4px solid var(--line);background:var(--card);font-size:20px;box-shadow:0 5px 0 var(--line);}
  .go:active,.rs:active{transform:translateY(5px);}
  .row{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:44px;font-size:15px;}
  .row input{width:26px;height:26px;accent-color:var(--ok);}
  /* うごいている あいだは そうさ パネルを かくす（ボタンだけ） */
  body.running.focus .right .panel{display:none;}
  body.running.focus main{grid-template-columns:1fr auto;}
  body.running.focus .right{justify-content:flex-end;}
  body.running.focus .big{flex-direction:column;}
  body.running.focus .go,body.running.focus .rs{width:150px;flex:none;}
  #end{position:fixed;inset:0;z-index:50;display:none;align-items:center;justify-content:center;flex-direction:column;gap:24px;background:rgba(250,247,239,.94);}
  body.dark #end{background:rgba(21,23,26,.94);}
  #end.show{display:flex;animation:pop .4s ease-out;}
  #end .t{font-size:clamp(60px,14vh,130px);color:var(--pie);}
  #end .s{font-size:clamp(22px,3.4vh,32px);}
  #end button{height:90px;padding:0 50px;border:none;border-radius:999px;background:var(--ok);color:#fff;font-size:30px;box-shadow:0 7px 0 var(--ok-d);}
  @keyframes pop{from{transform:scale(.8);opacity:0}to{transform:none;opacity:1}}
  @keyframes shake{0%,100%{transform:rotate(0)}25%{transform:rotate(-8deg)}75%{transform:rotate(8deg)}}
  #end .bell{font-size:90px;animation:shake .5s ease-in-out infinite;}
  footer{flex:none;text-align:center;font-size:12px;color:var(--sub);padding:0 0 6px;font-weight:500;}
  footer a{color:var(--blue);text-decoration:none;font-weight:700;}
  @media (orientation:portrait){main{grid-template-columns:1fr;grid-template-rows:auto 1fr;}.dial{width:min(80vw,40vh);}body.running.focus main{grid-template-columns:1fr;grid-template-rows:1fr auto;}body.running.focus .big{flex-direction:row;justify-content:center;}}
  @media (prefers-reduced-motion:reduce){*{animation:none!important;}}
</style>
</head>
<body class="focus">
<header>
  <div class="brand"><span class="orb"></span><strong>MieeL</strong><span class="u">mieel-support-school.com</span></div>
  <div class="ttl">⏳ みえる タイマー</div>
  <button class="tb" id="darkBtn" type="button" aria-label="くらい がめん">🌙</button>
  <button class="tb" id="fsBtn" type="button" aria-label="ぜんがめん">⛶</button>
</header>
<main>
  <section class="left">
    <div class="task" id="task"></div>
    <div class="dial"><svg id="dial" viewBox="0 0 400 400"></svg></div>
    <div class="time" id="time">5:00</div>
    <div class="msg" id="msg">じかんを えらんで「スタート」</div>
  </section>
  <section class="right">
    <div class="panel">
      <h3>じかん</h3>
      <div class="chips" id="chips"></div>
      <div class="adj">
        <button type="button" data-d="-60">−1ぷん</button><button type="button" data-d="-10">−10びょう</button>
        <button type="button" data-d="10">＋10びょう</button><button type="button" data-d="60">＋1ぷん</button>
      </div>
    </div>
    <div class="panel">
      <h3>いまは なにを する？</h3>
      <div class="acts" id="acts"></div>
    </div>
    <div class="panel">
      <h3>せってい</h3>
      <label class="row"><span>🔢 すうじの じかんを だす</span><input type="checkbox" id="optNum" checked></label>
      <label class="row"><span>🗣 「あと 1ぷん」「おわりです」を よみあげる</span><input type="checkbox" id="optVoice" checked></label>
      <label class="row"><span>🔔 おわりの おと</span><input type="checkbox" id="optSound" checked></label>
      <label class="row"><span>🙈 うごいている ときは ボタンだけに する</span><input type="checkbox" id="optFocus" checked></label>
    </div>
    <div class="big">
      <button class="go" id="goBtn" type="button">▶ スタート</button>
      <button class="rs" id="rsBtn" type="button">↺ もどす</button>
    </div>
  </section>
</main>
<footer>© みえる タイマー（特別支援教育向け）・学校や家庭での利用は自由です（無断転載・再配布・販売はお断り）　<a href="https://www.mieel-support-school.com/" target="_blank" rel="noopener">www.mieel-support-school.com</a></footer>
<div id="end" role="dialog"><div class="bell emo">🔔</div><div class="t">おわり！</div><div class="s" id="endTask"></div><button type="button" id="endBtn">OK</button></div>

<script>
(function () {
  'use strict';
  var PRESETS = [1, 2, 3, 5, 10, 15, 20, 30];
  var ACTS = [['', 'なし'], ['🧹', 'そうじ'], ['🍱', 'きゅうしょく'], ['✏️', 'べんきょう'], ['🪥', 'はみがき'], ['👕', 'きがえ'], ['🧸', 'あそび'], ['🧘', 'やすみ'], ['🚻', 'トイレ'], ['🎵', 'おんがく'], ['📖', 'どくしょ'], ['🧩', 'かたづけ']];
  var $ = function (id) { return document.getElementById(id); };
  var S = { total: 300, left: 300, end: 0, running: false, act: 0, announced: false };
  var OPTS = ['optNum', 'optVoice', 'optSound', 'optFocus'];
  try {
    var sv = JSON.parse(localStorage.getItem('mieel.timer') || '{}');
    if (sv.total) S.total = S.left = sv.total;
    if (sv.act != null) S.act = sv.act;
    OPTS.forEach(function (k) { if (sv[k] != null) $(k).checked = sv[k]; });
    if (sv.dark) document.body.classList.add('dark');
  } catch (e) { /* 無視 */ }
  function save() { try { var o = { total: S.total, act: S.act, dark: document.body.classList.contains('dark') }; OPTS.forEach(function (k) { o[k] = $(k).checked; }); localStorage.setItem('mieel.timer', JSON.stringify(o)); } catch (e) { /* 無視 */ } }

  /* ---------- えんばん（のこりが あかい ぶぶんで みえる） ---------- */
  var C = 200, R = 170;
  function fmt(s) { s = Math.max(0, Math.ceil(s)); return Math.floor(s / 60) + ':' + ('0' + s % 60).slice(-2); }
  function draw() {
    // めもりの はんい：5・15・30・60ぷん から えらぶ
    var max = S.total <= 300 ? 300 : S.total <= 900 ? 900 : S.total <= 1800 ? 1800 : 3600;
    var a = Math.max(0, S.left) / max * 360, mins = max / 60, lab = mins <= 5 ? 1 : 5;
    var s = '<circle cx="200" cy="200" r="190" fill="var(--card)" stroke="var(--line)" stroke-width="8"/>';
    for (var i = 0; i < 60; i++) {
      var r1 = (i * 6 - 90) * Math.PI / 180, maj = (i * mins / 60) % lab === 0 && ((i * mins) % 60 === 0), rr = maj ? 150 : 164;
      s += '<line x1="' + (C + 178 * Math.cos(r1)) + '" y1="' + (C + 178 * Math.sin(r1)) + '" x2="' + (C + rr * Math.cos(r1)) + '" y2="' + (C + rr * Math.sin(r1)) + '" stroke="var(--sub)" stroke-width="' + (maj ? 4 : 1.5) + '"/>';
    }
    var r0 = R * .86;
    if (a >= 359.9) s += '<circle cx="200" cy="200" r="' + r0 + '" fill="var(--pie)"/>';
    else if (a > 0) { var e = (a - 90) * Math.PI / 180; s += '<path d="M200 200 L200 ' + (200 - r0) + ' A' + r0 + ' ' + r0 + ' 0 ' + (a > 180 ? 1 : 0) + ' 1 ' + (200 + r0 * Math.cos(e)) + ' ' + (200 + r0 * Math.sin(e)) + ' Z" fill="var(--pie)"/>'; }
    for (var k = 0; k < mins; k += lab) { var aa = (k / mins * 360 - 90) * Math.PI / 180; s += '<text x="' + (C + 128 * Math.cos(aa)) + '" y="' + (C + 128 * Math.sin(aa) + 9) + '" text-anchor="middle" font-size="26" font-weight="800" fill="var(--sub)" stroke="var(--card)" stroke-width="5" paint-order="stroke" font-family="M PLUS Rounded 1c,sans-serif">' + k + '</text>'; }
    s += '<circle cx="200" cy="200" r="16" fill="var(--ink)"/>';
    $('dial').innerHTML = s;
    $('time').textContent = fmt(S.left);
    $('time').classList.toggle('hide', !$('optNum').checked);
  }

  /* ---------- おと・こえ ---------- */
  var ac = null;
  function tone(f, t, d) { try { if (!ac) ac = new (window.AudioContext || window.webkitAudioContext)(); if (ac.state === 'suspended') ac.resume(); var o = ac.createOscillator(), g = ac.createGain(), t0 = ac.currentTime + t; o.frequency.value = f; o.type = 'sine'; g.gain.setValueAtTime(0.0001, t0); g.gain.linearRampToValueAtTime(0.35, t0 + 0.03); g.gain.exponentialRampToValueAtTime(0.0001, t0 + d); o.connect(g); g.connect(ac.destination); o.start(t0); o.stop(t0 + d + 0.05); } catch (e) { /* 無視 */ } }
  function chime() { [[784, 0], [659, .45], [523, .9], [784, 1.6], [659, 2.05], [523, 2.5]].forEach(function (n) { tone(n[0], n[1], 1.1); }); }
  function say(t) { try { if (!('speechSynthesis' in window)) return; speechSynthesis.cancel(); var u = new SpeechSynthesisUtterance(t); u.lang = 'ja-JP'; u.rate = .9; var v = speechSynthesis.getVoices().filter(function (x) { return /^ja/i.test(x.lang); }); if (v[0]) u.voice = v.filter(function (x) { return /Kyoko|O-ren|Nanami|Haruka/i.test(x.name); })[0] || v[0]; speechSynthesis.speak(u); } catch (e) { /* 無視 */ } }

  /* ---------- うごき ---------- */
  var wake = null, raf = null, endLoop = null;
  function keepAwake(on) { try { if (on && navigator.wakeLock) navigator.wakeLock.request('screen').then(function (w) { wake = w; }, function () {}); else if (!on && wake) { wake.release(); wake = null; } } catch (e) { /* 無視 */ } }
  function loop() {
    if (!S.running) return;
    S.left = (S.end - Date.now()) / 1000;
    if (!S.announced && S.left <= 60) { S.announced = true; if ($('optVoice').checked) say('あと 1ぷん'); $('msg').textContent = 'あと 1ぷん！'; }
    if (S.left <= 0) { S.left = 0; draw(); return finish(); }
    draw();
    raf = requestAnimationFrame(loop);
  }
  function start() {
    if (S.left <= 0) S.left = S.total;
    S.end = Date.now() + S.left * 1000; S.running = true; S.announced = S.left <= 60 || S.total <= 90;
    document.body.classList.add('running'); tone(660, 0, .15);
    $('goBtn').textContent = '⏸ とめる'; $('goBtn').classList.add('pause');
    $('msg').textContent = ACTS[S.act][0] ? ACTS[S.act][1] + 'の じかん' : 'スタート！';
    keepAwake(true); loop();
  }
  function pause() {
    S.running = false; cancelAnimationFrame(raf); document.body.classList.remove('running');
    $('goBtn').textContent = '▶ つづき'; $('goBtn').classList.remove('pause'); $('msg').textContent = 'とまって います'; keepAwake(false);
  }
  function reset() {
    S.running = false; cancelAnimationFrame(raf); S.left = S.total; document.body.classList.remove('running');
    $('goBtn').textContent = '▶ スタート'; $('goBtn').classList.remove('pause'); $('msg').textContent = 'じかんを えらんで「スタート」'; keepAwake(false); draw();
  }
  function finish() {
    S.running = false; cancelAnimationFrame(raf); document.body.classList.remove('running'); keepAwake(false);
    $('endTask').textContent = ACTS[S.act][0] ? ACTS[S.act][0] + ' ' + ACTS[S.act][1] + 'は おわりです' : '';
    $('end').classList.add('show');
    if ($('optSound').checked) { chime(); endLoop = setInterval(chime, 5000); }
    setTimeout(function () { if ($('optVoice').checked && $('end').classList.contains('show')) say('おわりです'); }, 3200);
    $('goBtn').textContent = '▶ スタート'; $('goBtn').classList.remove('pause');
  }
  function setTotal(sec) { S.total = Math.min(3600, Math.max(10, sec)); S.left = S.total; save(); renderChips(); $('msg').textContent = fmt(S.total) + ' に したよ'; draw(); }

  function renderChips() {
    $('chips').innerHTML = '';
    PRESETS.forEach(function (m) { var b = document.createElement('button'); b.type = 'button'; b.className = 'chip' + (S.total === m * 60 ? ' on' : ''); b.textContent = m + 'ふん'; b.onclick = function () { if (!S.running) setTotal(m * 60); }; $('chips').appendChild(b); });
  }
  function renderActs() {
    $('acts').innerHTML = '';
    ACTS.forEach(function (a, i) { var b = document.createElement('button'); b.type = 'button'; b.className = 'act' + (S.act === i ? ' on' : ''); b.innerHTML = '<span class="emo">' + (a[0] || '⭕') + '</span>' + a[1]; b.onclick = function () { S.act = i; save(); renderActs(); showTask(); }; $('acts').appendChild(b); });
  }
  function showTask() { var a = ACTS[S.act]; $('task').innerHTML = a[0] ? '<span class="emo">' + a[0] + '</span>' + a[1] : ''; }

  document.querySelectorAll('.adj button').forEach(function (b) { b.onclick = function () { if (!S.running) setTotal(S.total + Number(b.dataset.d)); }; });
  $('goBtn').onclick = function () { if (S.running) pause(); else start(); };
  $('rsBtn').onclick = reset;
  $('endBtn').onclick = function () { clearInterval(endLoop); try { speechSynthesis.cancel(); } catch (e) { /* 無視 */ } $('end').classList.remove('show'); reset(); };
  OPTS.forEach(function (k) { $(k).onchange = function () { save(); document.body.classList.toggle('focus', $('optFocus').checked); draw(); }; });
  $('darkBtn').onclick = function () { document.body.classList.toggle('dark'); save(); draw(); };
  $('fsBtn').onclick = function () { var d = document.documentElement; try { if (!document.fullscreenElement) (d.requestFullscreen || d.webkitRequestFullscreen).call(d); else document.exitFullscreen(); } catch (e) { /* 無視 */ } };
  document.addEventListener('visibilitychange', function () { if (!document.hidden && S.running) keepAwake(true); });
  document.addEventListener('gesturestart', function (e) { e.preventDefault(); });
  document.body.classList.toggle('focus', $('optFocus').checked);
  renderChips(); renderActs(); showTask(); draw();
})();
</script>
</body>
</html>
