<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="からだ">
<meta name="theme-color" content="#FAF7EF">
<title>からだと けんこう｜MieeL</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
/*MZ-SHELL-CSS*/
/* ==========================================================================
   MieeL アプリ共通シェル（iPad 向け・全画面アプリ型）  shell.css
   ※ このファイルは _shell/build.py で各アプリの index.html に埋め込まれます
   ========================================================================== */
:root{
  --mz-main:#3F9D8B; --mz-main-d:#2C6B5D; --mz-soft:#DBEFEA;
  --mz-bg:#FAF7EF; --mz-card:#FFFFFF; --mz-ink:#2E2A25; --mz-sub:#7D7466; --mz-line:#EAE1CE;
  --mz-ok:#2F9E44; --mz-ok-d:#237A34; --mz-ok-soft:#E3F3E6;
  --mz-ng:#E03131; --mz-ng-soft:#FFE3E3;
  --mz-gold:#FAB005; --mz-blue:#1C7ED6; --mz-blue-d:#1864AB;
  --mieel:radial-gradient(circle at 50% 0%,#1B8FE8 0%,#2BB8D6 28%,#3FCB9E 45%,#8FD24A 58%,#F4D027 72%,#F7941E 100%);
  --mz-font:"M PLUS Rounded 1c","Hiragino Maru Gothic ProN","BIZ UDPGothic","Yu Gothic UI",sans-serif;
  --mz-emoji:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif;
  --mz-scale:1;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;height:100%;}
body.mz{
  background:var(--mz-bg);color:var(--mz-ink);font-family:var(--mz-font);font-weight:700;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:manipulation;overscroll-behavior:none;
  display:flex;flex-direction:column;height:100vh;height:100dvh;overflow:hidden;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  word-break:keep-all;overflow-wrap:anywhere;
}
:where(body.mz) button{font-family:inherit;font-weight:inherit;color:inherit;cursor:pointer;touch-action:manipulation;}
body.mz.big-text{--mz-scale:1.18;}
.mz-emoji{font-family:var(--mz-emoji);font-weight:400;line-height:1;}

/* ---------- 上のバー ---------- */
.mz-top{flex:none;display:flex;align-items:center;gap:12px;padding:8px 16px;min-height:66px;}
.mz-brand{display:flex;align-items:center;gap:7px;white-space:nowrap;flex:none;}
.mz-orb{width:22px;height:22px;border-radius:50%;background:var(--mieel);flex:none;}
.mz-brand strong{font-size:16px;}
.mz-brand .url{font-size:12px;color:var(--mz-sub);font-weight:500;}
.mz-apptitle{flex:1;min-width:0;display:flex;align-items:center;justify-content:center;gap:8px;font-size:clamp(18px,2.3vw,24px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.mz-apptitle .mz-emoji{font-size:1.3em;}
.mz-topbtn{flex:none;height:48px;padding:0 16px;border-radius:999px;border:3px solid var(--mz-line);background:#fff;font-size:16px;display:flex;align-items:center;gap:6px;box-shadow:0 3px 0 var(--mz-line);}
.mz-topbtn[hidden]{display:none;}
.mz-gear{position:relative;flex:none;width:50px;height:50px;border-radius:50%;border:none;background:transparent;opacity:.35;font-size:25px;display:grid;place-items:center;}
.mz-gear::after{content:"";position:absolute;inset:2px;border-radius:50%;border:4px solid transparent;}
.mz-gear.pressing{opacity:1;}
.mz-gear.pressing::after{border-color:var(--mz-blue);animation:mzRing 1.5s linear forwards;}
@keyframes mzRing{from{clip-path:inset(0 100% 0 0);}to{clip-path:inset(0 0 0 0);}}

main#mzView{flex:1;min-height:0;display:flex;flex-direction:column;padding:0 18px 16px;}
.mz-screen{flex:1;min-height:0;display:flex;flex-direction:column;animation:mzIn .25s ease-out;}
@keyframes mzIn{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:none;}}
@keyframes mzPop{from{transform:scale(.7);opacity:0;}to{transform:none;opacity:1;}}
@keyframes mzShake{20%,60%{transform:translateX(-10px);}40%,80%{transform:translateX(10px);}}
.mz-h1{margin:2px 0 12px;text-align:center;font-size:calc(clamp(26px,3.8vw,42px)*var(--mz-scale));}

/* ---------- ホーム：モードカード ---------- */
.mz-home{overflow-y:auto;padding-bottom:8px;}
.mz-modes{flex:1;display:grid;grid-template-columns:repeat(var(--mcols,2),minmax(0,1fr));grid-auto-rows:minmax(150px,1fr);gap:clamp(12px,2vw,20px);max-width:1100px;width:100%;margin:0 auto;}
@media (orientation:portrait){.mz-modes{--mcols:2!important;}}
.mz-mode{
  --c:var(--mz-main);position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;
  min-height:190px;padding:16px 12px;border-radius:30px;background:#fff;border:6px solid var(--c);
  box-shadow:0 7px 0 rgba(0,0,0,.12);text-align:center;
}
.mz-mode:active{transform:translateY(5px);box-shadow:0 2px 0 rgba(0,0,0,.12);}
.mz-mode .mz-emoji{font-size:calc(clamp(52px,6.5vw,72px)*var(--mz-scale));}
.mz-mode .nm{font-size:calc(clamp(22px,2.6vw,30px)*var(--mz-scale));}
.mz-mode .sb{font-size:calc(15px*var(--mz-scale));color:var(--mz-sub);font-weight:500;}
.mz-mode .best{position:absolute;top:8px;right:12px;color:var(--mz-gold);font-size:18px;letter-spacing:1px;}

/* ---------- レベル ---------- */
.mz-bar{flex:none;display:flex;align-items:center;gap:10px;margin-bottom:10px;}
.mz-back{flex:none;height:60px;padding:0 22px;border-radius:999px;border:4px solid #ADB5BD;background:#fff;color:#495057;font-size:22px;box-shadow:0 4px 0 #DEE2E6;}
.mz-back:active{transform:translateY(3px);box-shadow:0 1px 0 #DEE2E6;}
.mz-bar .mz-label{flex:1;min-width:0;text-align:center;font-size:calc(clamp(20px,2.4vw,28px)*var(--mz-scale));white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.mz-levels{flex:1;display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));grid-auto-rows:minmax(200px,min(52vh,340px));gap:18px;align-content:center;max-width:1060px;width:100%;margin:0 auto;}
.mz-level{
  --c:var(--mz-main);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;min-height:200px;
  border-radius:30px;border:6px solid var(--c);background:#fff;box-shadow:0 7px 0 rgba(0,0,0,.12);padding:16px;text-align:center;
}
.mz-level:active{transform:translateY(5px);box-shadow:0 2px 0 rgba(0,0,0,.12);}
.mz-level .stars{font-size:34px;color:var(--mz-gold);letter-spacing:4px;}
.mz-level .nm{font-size:calc(clamp(22px,2.6vw,30px)*var(--mz-scale));}
.mz-level .best{font-size:15px;color:var(--mz-sub);font-weight:500;}

/* ---------- あそぶ画面 ---------- */
.mz-dots{display:flex;gap:6px;flex:none;}
.mz-dots i{width:18px;height:18px;border-radius:50%;background:#E9E2D2;display:block;}
.mz-dots i.ok{background:var(--mz-gold);}
.mz-dots i.miss{background:#CFC6B4;}
.mz-dots i.now{background:#fff;border:4px solid var(--c,var(--mz-main));}
.mz-say{flex:none;width:64px;height:64px;border-radius:50%;border:4px solid var(--mz-line);background:#fff;font-size:30px;display:grid;place-items:center;box-shadow:0 4px 0 var(--mz-line);}
.mz-say:active{transform:translateY(3px);box-shadow:0 1px 0 var(--mz-line);}
.mz-stage{flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:safe center;gap:clamp(12px,2.2vh,24px);overflow-y:auto;padding-bottom:6px;}
.mz-stage.answered{padding-bottom:110px;}
.mz-q.compact{flex-direction:row;justify-content:center;gap:14px;padding:10px 24px;}
.mz-q.compact .qi{font-size:calc(44px*var(--mz-scale));}
.mz-q.compact .qt{font-size:calc(clamp(22px,2.8vw,32px)*var(--mz-scale));}
.mz-ow{width:min(100%,1100px);display:grid;grid-template-columns:1fr 1fr;gap:18px;align-items:start;}
.mz-ow .mz-slots,.mz-ow .mz-pool{width:100%;}
.mz-ow .mz-pool{flex-direction:column;align-items:stretch;}
.mz-ow .mz-tile{text-align:left;}
@media (orientation:portrait){.mz-ow{grid-template-columns:1fr;}.mz-ow .mz-pool{flex-direction:row;align-items:center;}}
.mz-q{
  --c:var(--mz-main);width:min(100%,900px);background:#fff;border:6px solid var(--c);border-radius:32px;
  padding:clamp(14px,2.4vh,26px) clamp(16px,3vw,34px);text-align:center;box-shadow:0 7px 0 rgba(0,0,0,.08);
  display:flex;flex-direction:column;align-items:center;gap:8px;animation:mzPop .35s cubic-bezier(.2,1.4,.4,1);
}
.mz-q .qi{font-size:calc(clamp(46px,7vh,76px)*var(--mz-scale));}
.mz-q .qi.big{font-size:calc(clamp(90px,17vh,150px)*var(--mz-scale));}
.mz-q .qt{font-size:calc(clamp(24px,3.4vw,38px)*var(--mz-scale));line-height:1.45;}
.mz-q .qs{font-size:calc(clamp(16px,1.9vw,20px)*var(--mz-scale));color:var(--mz-sub);font-weight:500;}
.mz-q .qv{display:flex;justify-content:center;align-items:center;max-width:100%;}
.mz-q .qv svg{max-width:100%;height:auto;}
.mz-opts{width:min(100%,960px);display:grid;gap:clamp(10px,1.6vw,18px);grid-template-columns:repeat(var(--cols,2),minmax(0,1fr));}
.mz-opt{
  --c:var(--mz-main);min-height:calc(clamp(84px,13vh,112px)*var(--mz-scale));padding:12px 18px;border-radius:26px;border:5px solid var(--c);background:#fff;
  font-size:calc(clamp(22px,2.9vw,34px)*var(--mz-scale));line-height:1.35;box-shadow:0 6px 0 var(--c);text-align:center;
  display:flex;align-items:center;justify-content:center;gap:10px;
}
.mz-opt:active{transform:translateY(5px);box-shadow:0 1px 0 var(--c);}
.mz-opt .mz-emoji{font-size:1.4em;}
.mz-opt.stack{flex-direction:column;gap:4px;padding:10px 8px;}
.mz-opt.stack .mz-emoji{font-size:1.6em;}
.mz-opt.ok{background:var(--mz-ok-soft);border-color:var(--mz-ok);box-shadow:0 6px 0 var(--mz-ok-d);color:#1F6A34;}
.mz-opt.ng{animation:mzShake .45s;border-color:var(--mz-ng);background:var(--mz-ng-soft);box-shadow:0 6px 0 #B02525;}
.mz-opt.gone{opacity:.28;pointer-events:none;box-shadow:none;transform:none;}
.mz-opt.dim{opacity:.35;}
.mz-explain{width:min(100%,860px);background:var(--mz-ok-soft);border-radius:18px;padding:10px 18px;font-size:calc(18px*var(--mz-scale));font-weight:500;text-align:center;line-height:1.6;animation:mzPop .3s ease-out;}
.mz-next{
  position:fixed;right:max(20px,env(safe-area-inset-right));bottom:max(20px,env(safe-area-inset-bottom));z-index:60;
  height:84px;padding:0 44px;border:none;border-radius:999px;background:var(--mz-ok);color:#fff;
  font-size:calc(clamp(26px,3.2vw,36px)*var(--mz-scale));box-shadow:0 7px 0 var(--mz-ok-d);animation:mzPop .35s ease-out, mzNudge 1.4s ease-in-out .6s infinite;
}
.mz-next:active{transform:translateY(5px);box-shadow:0 2px 0 var(--mz-ok-d);}
@keyframes mzNudge{50%{transform:scale(1.05);}}
.mz-hint{color:var(--mz-sub);font-weight:500;font-size:calc(17px*var(--mz-scale));text-align:center;}

/* ならべる */
.mz-slots{width:min(100%,960px);display:flex;flex-wrap:wrap;gap:10px;justify-content:center;padding:14px;border-radius:24px;border:4px dashed var(--mz-line);background:#FCFAF3;min-height:96px;}
.mz-slots.col{flex-direction:column;flex-wrap:nowrap;align-items:stretch;gap:8px;padding:10px 14px;}
.mz-slots.col .mz-slot{justify-content:flex-start;min-height:58px;}
.mz-slot{min-width:110px;min-height:72px;border-radius:18px;border:4px dashed #D9CFBB;background:#fff;display:flex;align-items:center;justify-content:center;gap:8px;padding:6px 14px;font-size:calc(clamp(18px,2.2vw,26px)*var(--mz-scale));}
.mz-slot .no{width:30px;height:30px;border-radius:50%;background:var(--c,var(--mz-main));color:#fff;display:grid;place-items:center;font-size:16px;flex:none;}
.mz-slot.filled{border-style:solid;border-color:var(--c,var(--mz-main));}
.mz-slot.ok{border-color:var(--mz-ok);background:var(--mz-ok-soft);}
.mz-slot.ng{border-color:var(--mz-ng);background:var(--mz-ng-soft);animation:mzShake .45s;}
.mz-pool{width:min(100%,960px);display:flex;flex-wrap:wrap;gap:12px;justify-content:center;}
.mz-tile{
  --c:var(--mz-main);min-height:72px;padding:8px 20px;border-radius:18px;border:5px solid var(--c);background:#fff;
  font-size:calc(clamp(18px,2.2vw,26px)*var(--mz-scale));box-shadow:0 5px 0 var(--c);
}
.mz-tile:active{transform:translateY(4px);box-shadow:0 1px 0 var(--c);}

/* よこならび（ながい ぶんしょう＋こたえ） */
.mz-side{width:min(100%,1180px);flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:18px;align-items:stretch;}
.mz-side>.mz-q{width:100%;overflow-y:auto;justify-content:safe center;}
.mz-sidep{display:flex;flex-direction:column;justify-content:safe center;gap:12px;min-height:0;overflow-y:auto;padding:4px 4px 10px;}
.mz-sidep .mz-opts{width:100%;}
.mz-sidep .mz-opt{min-height:calc(clamp(64px,9.5vh,92px)*var(--mz-scale));font-size:calc(clamp(19px,2.2vw,26px)*var(--mz-scale));padding:8px 14px;}
.mz-ask{width:min(100%,900px);text-align:center;font-size:calc(clamp(22px,2.7vw,30px)*var(--mz-scale));line-height:1.5;}
.mz-ask .tag{display:inline-block;font-size:.7em;padding:2px 12px;border-radius:999px;background:var(--mz-soft);color:var(--mz-main-d);margin-right:8px;vertical-align:middle;}
.mz-stage.answered .mz-sidep{padding-bottom:100px;}

/* なぞり */
.tmsg{font-size:calc(19px*var(--mz-scale));color:var(--mz-sub);text-align:center;}
.trace{position:relative;height:min(50vh,420px);aspect-ratio:var(--ar,1);max-width:100%;background:#fff;border-radius:28px;border:5px solid var(--mz-line);box-shadow:0 6px 0 rgba(0,0,0,.06);}
.trace canvas{position:absolute;inset:0;width:100%;height:100%;border-radius:24px;}
.trace .ti{touch-action:none;}
.trace .gridl{position:absolute;inset:0;border-radius:24px;pointer-events:none;background:linear-gradient(90deg,transparent calc(50% - 1px),#EADFC8 calc(50% - 1px),#EADFC8 calc(50% + 1px),transparent calc(50% + 1px)),linear-gradient(0deg,transparent calc(50% - 1px),#EADFC8 calc(50% - 1px),#EADFC8 calc(50% + 1px),transparent calc(50% + 1px));opacity:.8;}
.tbar{display:flex;gap:16px;}
.tbtn{height:64px;padding:0 26px;border-radius:999px;border:4px solid var(--mz-line);background:#fff;font-size:22px;box-shadow:0 4px 0 var(--mz-line);}
.tbtn.ok{background:var(--mz-ok);border-color:var(--mz-ok-d);color:#fff;box-shadow:0 5px 0 var(--mz-ok-d);}

/* すうじキー */
.mz-pad{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:clamp(8px,1.2vh,12px);width:min(100%,330px);}
.mz-pad button{height:calc(clamp(54px,8.4vh,80px)*var(--mz-scale));border-radius:20px;border:4px solid #D9CFBB;background:#fff;font-size:calc(clamp(28px,4vh,40px)*var(--mz-scale));box-shadow:0 5px 0 #D9CFBB;}
.mz-pad button.fn{background:#F4EFE3;}
.mz-pad button.ok{background:var(--mz-ok);border-color:var(--mz-ok-d);color:#fff;box-shadow:0 5px 0 var(--mz-ok-d);}
.mz-pad button:active{transform:translateY(4px);box-shadow:0 1px 0 #D9CFBB;}

/* ---------- けっか ---------- */
.mz-result{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:clamp(10px,2vh,22px);text-align:center;}
.mz-result h2{margin:0;font-size:calc(clamp(44px,7vw,84px)*var(--mz-scale));color:#F76707;-webkit-text-stroke:3px #fff;paint-order:stroke fill;}
.mz-result .big-stars{font-size:clamp(46px,7vw,76px);letter-spacing:6px;}
.mz-result .big-stars .off{filter:grayscale(1);opacity:.25;}
.mz-result .msg{font-size:calc(clamp(20px,2.6vw,28px)*var(--mz-scale));}
.mz-actions{display:flex;gap:16px;flex-wrap:wrap;justify-content:center;}
.mz-big{height:84px;min-width:220px;padding:0 30px;border:none;border-radius:999px;color:#fff;font-size:calc(clamp(22px,2.8vw,30px)*var(--mz-scale));display:flex;align-items:center;justify-content:center;gap:10px;}
.mz-big.go{background:var(--mz-ok);box-shadow:0 7px 0 var(--mz-ok-d);}
.mz-big.blue{background:var(--mz-blue);box-shadow:0 7px 0 var(--mz-blue-d);}
.mz-big.gray{background:#868E96;box-shadow:0 7px 0 #5C636A;}
.mz-big:active{transform:translateY(5px);box-shadow:0 2px 0 rgba(0,0,0,.25);}

/* 正解の ○ */
#mzCorrect{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none;z-index:70;opacity:0;}
#mzCorrect.show{animation:mzFade 1.05s ease forwards;}
@keyframes mzFade{0%{opacity:0;}8%{opacity:1;}78%{opacity:1;}100%{opacity:0;}}
#mzCorrect .wrap{position:relative;width:min(260px,55vmin);height:min(260px,55vmin);filter:drop-shadow(0 6px 14px rgba(0,0,0,.18));}
#mzCorrect svg{width:100%;height:100%;transform:rotate(-90deg);}
#mzCorrect circle{fill:rgba(255,255,255,.92);stroke:#E2483D;stroke-width:15;stroke-linecap:round;stroke-dasharray:530;stroke-dashoffset:530;}
#mzCorrect.show circle{animation:mzDraw .5s cubic-bezier(.4,0,.2,1) forwards;}
@keyframes mzDraw{to{stroke-dashoffset:0;}}
#mzCorrect .lb{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:30px;font-weight:900;color:#E2483D;}
.mz-confetti{position:fixed;top:-50px;pointer-events:none;z-index:65;font-family:var(--mz-emoji);animation:mzFall linear forwards;}
@keyframes mzFall{to{transform:translateY(115vh) rotate(var(--r));}}

/* ---------- シート・設定・トースト ---------- */
.mz-modal{position:fixed;inset:0;z-index:80;background:rgba(17,24,39,.55);display:none;align-items:flex-start;justify-content:center;padding:24px 12px;overflow-y:auto;-webkit-user-select:text;user-select:text;}
.mz-modal.open{display:flex;}
.mz-panel{width:min(100%,780px);background:#fff;border-radius:24px;padding:20px clamp(16px,4vw,30px) 26px;font-weight:500;font-size:17px;box-shadow:0 20px 60px rgba(0,0,0,.3);word-break:normal;}
.mz-panel .hd{display:flex;align-items:center;justify-content:space-between;gap:12px;}
.mz-panel h2{margin:0;font-size:23px;font-weight:800;}
.mz-panel h3{margin:24px 0 8px;font-size:18px;font-weight:800;padding-left:10px;border-left:6px solid var(--mz-blue);}
.mz-note{color:var(--mz-sub);font-size:14px;line-height:1.7;margin:6px 0;}
.mz-panel label.row{display:flex;align-items:center;gap:12px;min-height:52px;padding:6px 0;border-bottom:1px solid #F1F3F5;}
.mz-panel label.row>span:first-child{flex:1;}
.mz-panel input[type=checkbox]{width:30px;height:30px;accent-color:var(--mz-ok);}
.mz-panel input[type=range]{width:200px;accent-color:var(--mz-blue);}
.mz-seg{display:flex;gap:8px;flex-wrap:wrap;}
.mz-seg button{flex:1;min-width:110px;padding:11px 8px;font-size:15px;font-weight:800;border-radius:12px;border:2px solid #CED4DA;background:#fff;}
.mz-seg button.on{background:#2E2A25;border-color:#2E2A25;color:#fff;}
.mz-seglabel{margin:12px 0 6px;font-weight:800;font-size:15px;}
.mz-btn{border:none;border-radius:12px;padding:11px 18px;font-size:16px;font-weight:800;background:#E9ECEF;color:var(--mz-ink);}
.mz-btn.ok{background:var(--mz-ok);color:#fff;}
.mz-btn.warn{background:#FFF0F0;color:#C92A2A;}
.mz-teacher{background:#F8F9FA;border-radius:14px;padding:12px 16px;font-size:14px;line-height:1.8;color:#495057;}
.mz-foot{margin-top:26px;padding-top:14px;border-top:1px solid #E9ECEF;text-align:center;color:var(--mz-sub);font-size:13px;line-height:1.8;}
.mz-foot .mz-brand{justify-content:center;}
.mz-foot a{color:var(--mz-blue);font-weight:800;text-decoration:none;font-size:14px;}
.mz-toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:rgba(17,24,39,.9);color:#fff;padding:14px 22px;border-radius:14px;font-size:18px;z-index:90;display:none;max-width:90vw;text-align:center;}
.mz-toast.show{display:block;}

/* ---------- プリント作成（先生用） ---------- */
.mz-print{flex:1;min-height:0;display:grid;grid-template-columns:minmax(290px,370px) 1fr;gap:14px;}
.mz-pctrl{overflow-y:auto;background:#fff;border-radius:24px;border:4px solid var(--mz-line);padding:8px 16px 18px;font-weight:500;}
.mz-pctrl .lab{font-weight:800;font-size:15px;color:#5F574A;margin:14px 0 6px;}
.mz-chips{display:flex;flex-wrap:wrap;gap:6px;}
.mz-chip{border:2px solid var(--mz-line);background:#FCFAF3;border-radius:999px;padding:9px 14px;font-weight:800;font-size:15px;}
.mz-chip.on{border-color:var(--mz-main);background:var(--mz-soft);color:var(--mz-main-d);}
.mz-pgo{margin-top:18px;width:100%;height:64px;border:none;border-radius:999px;background:var(--mz-ok);color:#fff;font-size:22px;box-shadow:0 5px 0 var(--mz-ok-d);}
.mz-pgo.sub{background:#fff;color:var(--mz-ink);border:3px solid var(--mz-line);box-shadow:0 4px 0 var(--mz-line);height:54px;font-size:18px;margin-top:10px;}
.mz-preview{overflow:auto;background:#E6E1D6;border-radius:24px;padding:16px;min-height:0;}
.mz-preview .ws-page{margin:0 auto 16px;box-shadow:0 4px 18px rgba(0,0,0,.18);}
@media (orientation:portrait) and (max-width:900px){.mz-print{grid-template-columns:1fr;grid-template-rows:auto 1fr;}.mz-pctrl{max-height:44vh;}}

/* A4 プリント本体 */
.ws-page{width:210mm;height:297mm;padding:12mm;background:#fff;color:#222;box-sizing:border-box;overflow:hidden;font-family:var(--mz-font);font-weight:700;display:flex;flex-direction:column;-webkit-print-color-adjust:exact;print-color-adjust:exact;word-break:keep-all;overflow-wrap:anywhere;}
.ws-head{flex:none;display:flex;justify-content:space-between;align-items:flex-end;gap:6mm;border-bottom:.8mm solid #222;padding-bottom:3mm;margin-bottom:5mm;}
.ws-brand{display:flex;align-items:center;gap:2mm;font-size:3.2mm;}
.ws-orb{width:5mm;height:5mm;border-radius:50%;background:var(--mieel);flex:none;}
.ws-head h2{margin:1mm 0 0;font-size:6mm;line-height:1.25;}
.ws-inst{font-size:3.4mm;color:#555;font-weight:500;margin-top:.8mm;}
.ws-fields{flex:none;text-align:right;font-size:3.8mm;line-height:1.75;white-space:nowrap;}
.ws-url{font-size:3mm;color:#1C7ED6;}
.ws-blank{display:inline-block;border-bottom:.4mm solid #222;min-width:36mm;margin-left:1.5mm;}
.ws-no{font-size:3mm;color:#888;margin-left:2mm;}
.ws-body{flex:1;min-height:0;overflow:hidden;display:grid;grid-template-columns:repeat(var(--wcols,2),minmax(0,1fr));gap:4mm;align-content:start;}
.ws-cell{border:.45mm solid #CFC6B4;border-radius:3mm;padding:3mm 4mm;break-inside:avoid;font-size:4.2mm;line-height:1.5;}
.ws-cell .n{font-size:3.2mm;color:#8A8072;margin-bottom:1mm;}
.ws-cell .q{font-size:4.6mm;text-align:center;margin-bottom:2mm;}
.ws-cell .q .mz-emoji{font-size:1.5em;vertical-align:middle;margin-right:1mm;}
.ws-cell .v{display:flex;justify-content:center;margin:1mm 0 2mm;}
.ws-cell .v svg{max-height:38mm;width:auto;max-width:100%;}
.ws-opts{display:flex;flex-wrap:wrap;gap:2mm;justify-content:center;}
.ws-opt{border:.35mm solid #444;border-radius:2mm;padding:1.2mm 3mm;font-size:4mm;background:#fff;}
.ws-ans{margin-top:2mm;text-align:center;color:#C92A2A;font-size:3.6mm;}
.ws-line{border-bottom:.35mm solid #333;height:9mm;flex:1;}
.ws-lines .r{display:flex;align-items:flex-end;gap:2mm;margin-top:1mm;}
.ws-lines .r b{color:#8A8072;width:5mm;}
.ws-tiles{display:flex;flex-wrap:wrap;gap:2mm;justify-content:center;margin-bottom:1mm;}
.ws-tiles span{border:.35mm solid #999;background:#F8F4EA;border-radius:2mm;padding:1mm 3mm;font-size:4mm;}
.ws-box{display:inline-block;min-width:14mm;height:9mm;border:.4mm solid #333;border-radius:1.5mm;vertical-align:middle;}
.ws-ord{display:flex;flex-direction:column;gap:1.8mm;align-items:flex-start;margin:1mm auto 0;width:fit-content;max-width:100%;}
.ws-ord .r{display:flex;align-items:center;gap:3mm;font-size:4.3mm;}
.ws-ord .bx{flex:none;width:10mm;height:10mm;border:.45mm solid #333;border-radius:1.5mm;display:grid;place-items:center;color:#C92A2A;font-size:5mm;}
.ws-page.big .ws-cell{font-size:5.4mm;padding:4mm 5mm;}
.ws-page.big .ws-cell .q{font-size:6.2mm;}
.ws-page.big .ws-opt{font-size:5.4mm;padding:2mm 4mm;}
.ws-page.big .ws-ord .r{font-size:5.6mm;}
.ws-page.big .ws-ord .bx{width:12mm;height:12mm;}
.ws-page.big .ws-cell .v svg{max-height:52mm;}
#mzWorksheet{display:none;}
@page{size:A4 portrait;margin:0;}
@media print{
  html,body{height:auto!important;overflow:visible!important;display:block!important;background:#fff!important;padding:0!important;}
  body>*:not(#mzWorksheet){display:none!important;}
  #mzWorksheet{display:block!important;}
  #mzWorksheet .ws-page{break-after:page;page-break-after:always;box-shadow:none;margin:0;zoom:1!important;}
  #mzWorksheet .ws-page:last-child{break-after:auto;page-break-after:auto;}
}

/* 刺激ひかえめ */
body.mz.calm *,body.mz.calm *::before,body.mz.calm *::after{animation:none!important;transition:none!important;}
@media (prefers-reduced-motion:reduce){body.mz *,body.mz *::before,body.mz *::after{animation:none!important;transition:none!important;}}
@media (max-width:760px){.mz-brand .url{display:none;}.mz-top .mz-topbtn span.t{display:none;}}

<body class="mz">

<script>
/*MZ-SHELL-JS*/
/* ==========================================================================
   MieeL アプリ共通シェル（iPad 向け・全画面アプリ型）  shell.js
   ※ このファイルは _shell/build.py で各アプリの index.html に埋め込まれます

   つかいかた（各アプリ側）:
     MieelApp.start({
       id, title, icon, color, colorD, soft, teacherNote,
       modes: [{
         id, name, sub, icon, color,
         levels: [{ id, name, stars }],
         kind: 'choice' | 'order' | 'custom',
         pool(level) -> [item...]   または  make(level) -> q
         toQ(item, level) -> q      （pool を使うとき・省略可）
         render(stage, q, api)      （custom のとき）
         print: { instruction, cols, cell(q, showAnswer) }   （省略可・false で印刷なし）
       }],
       options: [{ key, label, type:'check'|'seg', opts:[[値,'ラベル']], def, print:true, regen:true }]  （アプリ独自の せってい・省略可）
     });
     MieelApp.opt(key) で アプリ独自の せっていを よめます。 MieelApp.numpad(onKey, {extra}) で すうじキーを つくれます。
     choice の q: { icon, text, sub, html, say, options:[文字 | {label, value, icon, html}], answer, sayAnswer, explain, cols,
                   side（よこむきで カードを ひだり・こたえを みぎに）, ask（こたえの うえに だす しつもん html） }
     options の type: 'check' | 'seg' | 'multi'（はいれつ）。 printOnly:true で プリント画面だけに だす。
     print の counts:[[かず,'ラベル']...] と defCount で もんだいすうの えらびかたを かえられます。
     order  の q: { icon, text, tokens:[...], say }
   ========================================================================== */
window.MieelApp = (function () {
  'use strict';

  /* ---------- 小さな道具 ---------- */
  var $ = function (s, r) { return (r || document).querySelector(s); };
  var $$ = function (s, r) { return Array.prototype.slice.call((r || document).querySelectorAll(s)); };
  function h(tag, props) {
    var el = document.createElement(tag);
    if (props) Object.keys(props).forEach(function (k) {
      var v = props[k];
      if (v === null || v === undefined || v === false) return;
      if (k === 'class') el.className = v;
      else if (k === 'html') el.innerHTML = v;
      else if (k === 'style') el.setAttribute('style', v);
      else if (k.slice(0, 2) === 'on') el.addEventListener(k.slice(2), v);
      else el.setAttribute(k, v === true ? '' : v);
    });
    (function add(list) {
      list.forEach(function (c) {
        if (c === null || c === undefined || c === false) return;
        if (Array.isArray(c)) add(c);
        else el.appendChild(typeof c === 'string' || typeof c === 'number' ? document.createTextNode(String(c)) : c);
      });
    })(Array.prototype.slice.call(arguments, 2));
    return el;
  }
  function shuffle(a) { var r = a.slice(); for (var i = r.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var t = r[i]; r[i] = r[j]; r[j] = t; } return r; }
  function pick(a) { return a[Math.floor(Math.random() * a.length)]; }
  function esc(t) { return String(t).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
  function emo(e, cls) { return h('span', { class: 'mz-emoji' + (cls ? ' ' + cls : '') }, e); }
  function load(k) { try { var v = localStorage.getItem(k); return v ? JSON.parse(v) : null; } catch (e) { return null; } }
  function save(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { /* 保存できなくても動く */ } }

  var PRAISE = ['やったね！', 'せいかい！', 'すごい！', 'ばっちり！', 'よくできました！', 'かっこいい！'];
  var TRY = ['もういちど！', 'おしい！', 'ゆっくり かんがえよう', 'だいじょうぶ、もういっかい！'];
  var DEF = { setSize: 5, autoRead: true, sound: true, volume: 0.8, rate: 0.9, errorless: true, autoNext: false, bigText: false, calm: false };

  var A = null, S = null, P = null;     // アプリ設定・せってい・きろく
  var st = { screen: 'home' };          // いまの じょうたい
  var lockUntil = 0;
  function tapOk(ms) { var n = Date.now(); if (n < lockUntil) return false; lockUntil = n + (ms || 450); return true; }
  function lock(ms) { lockUntil = Math.max(lockUntil, Date.now() + ms); }

  /* ---------- 音 ---------- */
  var ac = null;
  function audio() {
    if (!S.sound) return null;
    try {
      if (!ac) { var C = window.AudioContext || window.webkitAudioContext; if (!C) return null; ac = new C(); }
      if (ac.state === 'suspended') ac.resume();
      return ac;
    } catch (e) { return null; }
  }
  function tone(f, start, dur, type, vol) {
    var a = audio(); if (!a) return;
    var t = a.currentTime + start, o = a.createOscillator(), g = a.createGain();
    o.type = type || 'sine'; o.frequency.setValueAtTime(f, t);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime((vol || 0.25) * S.volume, t + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(a.destination); o.start(t); o.stop(t + dur + 0.05);
  }
  var sfx = {
    tap: function () { tone(740, 0, 0.08, 'triangle', 0.15); },
    ok: function () { tone(880, 0, 0.3, 'sine', 0.32); tone(1318.5, 0.22, 0.5, 'sine', 0.28); },
    ng: function () { tone(330, 0, 0.16, 'triangle', 0.18); tone(262, 0.12, 0.22, 'triangle', 0.16); },
    put: function (i) { tone([523, 587, 659, 698, 784, 880, 988, 1047][i % 8], 0, 0.14, 'triangle', 0.2); },
    fanfare: function () {
      [[523, 0], [659, 0.1], [784, 0.2], [1047, 0.32], [784, 0.5], [1047, 0.62]].forEach(function (n) { tone(n[0], n[1], 0.32, 'square', 0.06); tone(n[0], n[1], 0.38, 'triangle', 0.2); });
      [1568, 2093, 2637].forEach(function (f, i) { tone(f, 0.95 + i * 0.07, 0.5, 'sine', 0.09); });
    }
  };

  /* ---------- 読み上げ（日本語の声を えらぶ） ---------- */
  var canSpeak = 'speechSynthesis' in window && 'SpeechSynthesisUtterance' in window;
  var jaVoice = null;
  function loadVoice() {
    if (!canSpeak) return;
    var v = (speechSynthesis.getVoices() || []).filter(function (x) { return /^ja(-|_|$)/i.test(x.lang); });
    jaVoice = v.filter(function (x) { return /Kyoko|O-ren|Otoya|Hattori|Nanami|Haruka/i.test(x.name); })[0] || v.filter(function (x) { return x.localService; })[0] || v[0] || null;
  }
  function jaSay(t) {
    // 読み上げで 単語の あたまの「は」「へ」が 助詞（わ・え）と 読まれないように カタカナに する（はこ→ハこ、へや→ヘや）
    return String(t == null ? '' : t).replace(/なかまはずれ/g, '仲間外れ').replace(/(^|[\s、。！？!?・（(「『])([はへ])(?=[\u3041-\u3096\u30A1-\u30FA\u30FC\u4E00-\u9FFF])/g, function (m, a, c) { return a + (c === 'は' ? 'ハ' : 'ヘ'); });
  }
  function speak(text, rate) {
    if (!canSpeak || !text) return;
    try {
      speechSynthesis.cancel();
      var u = new SpeechSynthesisUtterance(jaSay(String(text).replace(/[〇○]{2}/g, 'まるまる')));
      u.lang = 'ja-JP'; u.rate = rate || S.rate; u.pitch = 1.1;
      if (jaVoice) u.voice = jaVoice;
      speechSynthesis.speak(u);
    } catch (e) { /* 読み上げできなくても動く */ }
  }
  function stopSpeak() { if (canSpeak) { try { speechSynthesis.cancel(); } catch (e) { /* 無視 */ } } }

  /* ---------- 演出 ---------- */
  var okTimer = null;
  function showCorrect() {
    var o = $('#mzCorrect');
    clearTimeout(okTimer);
    o.classList.remove('show'); void o.offsetWidth; o.classList.add('show');
    okTimer = setTimeout(function () { o.classList.remove('show'); }, 1150);
  }
  function confetti() {
    if (S.calm) return;
    var items = ['🎉', '⭐', '🎊', '✨', '🌟', '💖'];
    for (var i = 0; i < 40; i++) {
      var c = h('span', { class: 'mz-confetti' }, pick(items));
      c.style.left = Math.random() * 100 + 'vw';
      c.style.fontSize = (24 + Math.random() * 28) + 'px';
      c.style.animationDuration = (2.2 + Math.random() * 1.6) + 's';
      c.style.animationDelay = (Math.random() * 0.7) + 's';
      c.style.setProperty('--r', (Math.random() * 900 - 450) + 'deg');
      document.body.appendChild(c);
      (function (el) { setTimeout(function () { el.remove(); }, 4800); })(c);
    }
  }
  var toastT = null;
  function toast(msg) { var t = $('#mzToast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(function () { t.classList.remove('show'); }, 2400); }

  /* ---------- 画面の わく ---------- */
  function setView(cls, kids) {
    var v = $('#mzView');
    v.innerHTML = '';
    v.appendChild(h('section', { class: 'mz-screen ' + cls }, kids));
  }
  function setTop(showPrint) {
    var b = $('#mzPrintBtn');
    if (b) b.hidden = !showPrint;
  }
  function modeColor(m) { return m && m.color ? m.color : A.color; }

  /* ---------- ホーム ---------- */
  function renderHome() {
    st.screen = 'home';
    setUrl(false);
    stopSpeak();
    setTop(A.modes.some(function (m) { return m.print !== false; }));
    setView('mz-home', [
      h('h1', { class: 'mz-h1' }, A.homeTitle || 'どれを する？'),
      h('div', { class: 'mz-modes', style: '--mcols:' + (A.modes.length <= 2 ? A.modes.length : A.modes.length <= 4 ? 2 : 3) }, A.modes.map(function (m) {
        var best = bestOfMode(m);
        return h('button', {
          type: 'button', class: 'mz-mode', style: '--c:' + modeColor(m),
          onclick: function () { if (!tapOk(500)) return; sfx.tap(); speak(m.say || m.name); openMode(m); }
        }, best ? h('span', { class: 'best' }, '★'.repeat(best)) : null, emo(m.icon || '⭐'), h('span', { class: 'nm' }, m.name), m.sub ? h('span', { class: 'sb' }, m.sub) : null);
      }))
    ]);
  }
  function bestOfMode(m) {
    var b = 0;
    (m.levels || [{ id: 1 }]).forEach(function (l) { var r = P[m.id + ':' + l.id]; if (r) b = Math.max(b, r.stars5 || 0); });
    return b;
  }

  function openMode(m) {
    st.mode = m;
    if (!m.levels || m.levels.length <= 1) { startSet(m, m.levels ? m.levels[0].id : 1); return; }
    renderLevels(m);
  }

  /* ---------- レベル ---------- */
  function renderLevels(m) {
    st.screen = 'levels';
    setTop(false);
    setView('mz-lv', [
      h('div', { class: 'mz-bar' },
        h('button', { type: 'button', class: 'mz-back', onclick: function () { if (tapOk(400)) renderHome(); } }, '◀ もどる'),
        h('div', { class: 'mz-label' }, emo(m.icon || ''), ' ', m.name),
        h('span', { style: 'width:120px' })),
      h('div', { class: 'mz-levels' }, m.levels.map(function (lv) {
        var r = P[m.id + ':' + lv.id];
        return h('button', {
          type: 'button', class: 'mz-level', style: '--c:' + modeColor(m),
          onclick: function () { if (!tapOk(500)) return; sfx.tap(); speak(lv.name); startSet(m, lv.id); }
        }, h('span', { class: 'stars' }, lv.stars || ''), h('span', { class: 'nm' }, lv.name),

      }))

  }

  /* ---------- もんだいの よういの しかた ---------- */
  function makeQueue(m, level) {
    return { m: m, level: level, list: [], used: {} };
  }
  function drawQ(qu) {
    var m = qu.m;
    if (m.pool) {
      if (!qu.list.length) {
        var pool = m.pool(qu.level) || [];
        qu.list = shuffle(pool);
        if (qu.last && qu.list.length > 1 && qu.list[0] === qu.last) qu.list.push(qu.list.shift());
      }
      var item = qu.list.shift();
      qu.last = item;
      return m.toQ ? m.toQ(item, qu.level) : item;
    }
    // make で つくる もんだいは、同じ もんだいが つづかないように する
    var q, key, tries = 0;
    do { q = m.make(qu.level); key = qKey(q); tries++; } while (qu.used[key] && tries < 30);
    qu.used[key] = true;
    return q;
  }
  function qKey(q) { return JSON.stringify([q.text, q.html, q.answer, q.tokens, q.key]); }

  /* ---------- セット（5もん など） ---------- */
  function startSet(m, level) {
    st.mode = m; st.level = level;
    st.set = { n: Number(S.setSize) || 5, i: 0, results: [], queue: makeQueue(m, level) };
    showQ();
  }

  function levelName() {
    var m = st.mode, l = (m.levels || []).filter(function (x) { return x.id === st.level; })[0];
    return m.name + (l && m.levels.length > 1 ? '（' + l.name + '）' : '');
  }

  function showQ() {
    st.screen = 'play';
    setTop(false);
    var m = st.mode, set = st.set;
    var q = drawQ(set.queue);
    set.q = q; set.first = true; set.locked = false;
    var color = modeColor(m);
    var dots = h('div', { class: 'mz-dots', style: '--c:' + color });
    for (var k = 0; k < set.n; k++) dots.appendChild(h('i', { class: k < set.results.length ? set.results[k] : k === set.i ? 'now' : '' }));
    var stage = h('div', { class: 'mz-stage', id: 'mzStage' });
    setView('mz-play', [
      h('div', { class: 'mz-bar' },
        h('button', { type: 'button', class: 'mz-back', onclick: function () { if (!tapOk(400)) return; stopSpeak(); if (m.levels && m.levels.length > 1) renderLevels(m); else renderHome(); } }, '◀ もどる'),
